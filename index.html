     <p style="font-size:13.5px;line-height:1.6;color:var(--text-2)">In the WHOOP app: <b>Profile → Settings → Data Export</b>. You will be emailed a ZIP. Unzip it and select the CSV files here — you can pick several at once.</p>
     <div style="margin-top:12px">
       ${[['physiological_cycles.csv','Recovery, HRV, RHR, strain, sleep — the main file'],
          ['sleeps.csv','Sleep detail and naps'],
          ['workouts.csv','Individual activities and their strain'],
          ['journal_entries.csv','Behaviour log']].map(([f,d])=>
         `<div class="kv"><span class="k mono">${f}</span><span class="v" style="font-weight:600;font-size:11.5px;color:var(--text-3);max-width:52%">${d}</span></div>`).join('')}
     </div>
     <button class="btn primary big block" id="impGo" style="margin-top:14px">${svg('ul')} Choose CSV files</button>
     <div class="hint" style="margin-top:9px">Files are read in your browser only. Nothing is uploaded anywhere. Re-importing the same export is safe — duplicates are detected and skipped.</div>
   </div>
   ${DB.whoop.cycles.length?`<div class="card">
     <div class="card-h"><div class="card-t">Currently loaded</div></div>
     <div class="kv"><span class="k">Cycles</span><span class="v">${DB.whoop.cycles.length} (${DB.whoop.cycles[0].date} → ${DB.whoop.cycles[DB.whoop.cycles.length-1].date})</span></div>
     <div class="kv"><span class="k">Workouts</span><span class="v">${DB.whoop.workouts.length}</span></div>
     <div class="kv"><span class="k">Journal rows</span><span class="v">${DB.whoop.journal.length}</span></div>
   </div>`:''}
   ${im.length?`<div class="card">
     <div class="card-h"><div class="card-t">Import history</div></div>
     ${im.slice(0,8).map(x=>`<div class="kv"><span class="k">${new Date(x.at).toLocaleString()}</span>
       <span class="v" style="font-size:11.5px">${x.results.map(r=>r.error?`<span style="color:var(--red)">${esc(r.file)}: ${esc(r.error)}</span>`:`${esc(r.kind)} +${r.added}${r.dupes?` (${r.dupes} dup)`:''}`).join('<br>')}</span></div>`).join('')}
   </div>`:''}
   <div class="card">
     <div class="card-t" style="margin-bottom:9px">Safety rules this importer follows</div>
     <ul class="why" style="border:none;padding:0;margin:0">
       <li class="pos"><span class="dot"></span><span>File type is detected from the <b>headers</b>, not the filename — renamed files still work.</span></li>
       <li class="pos"><span class="dot"></span><span>Column names are matched loosely, so a changed WHOOP header still resolves instead of silently producing blanks.</span></li>
       <li class="pos"><span class="dot"></span><span>Cycles are keyed by date, workouts by start time + activity, journal rows by date + question — re-importing never duplicates.</span></li>
       <li class="pos"><span class="dot"></span><span>Existing values are never overwritten; a re-import only fills gaps.</span></li>
       <li class="pos"><span class="dot"></span><span>Naps are skipped so they cannot overwrite a main sleep.</span></li>
       <li class="warn"><span class="dot"></span><span>If a file cannot be recognised it is <b>rejected with a message</b> rather than imported as wrong data.</span></li>
     </ul>
   </div>`;
  $('#impGo').onclick=()=>$('#fileIn').click();
}
$('#fileIn').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  toast('Reading '+files.length+' file'+(files.length>1?'s':'')+'…');
  const results=[];
  for(const f of files){
    try{ const txt=await f.text(); results.push(importWhoopFile(f.name,txt)); }
    catch(err){ results.push({file:f.name,error:'Could not read file',added:0,dupes:0}); }
  }
  DB.whoop.imports.push({at:new Date().toISOString(),results});
  recomputeBaselines(); saveWhoop();
  e.target.value='';
  const ok=results.filter(r=>!r.error), bad=results.filter(r=>r.error);
  const added=sum(ok.map(r=>r.added)), dup=sum(ok.map(r=>r.dupes));
  openSheet('Import complete',`
    ${ok.map(r=>`<div class="card tight"><div style="font-weight:750;font-size:14px">${esc(r.file)}</div>
      <div class="kv"><span class="k">Detected as</span><span class="v">${esc(r.kind||'—')}</span></div>
      <div class="kv"><span class="k">Rows in file</span><span class="v">${r.rows}</span></div>
      <div class="kv"><span class="k">New records added</span><span class="v" style="color:var(--accent)">${r.added}</span></div>
      ${r.merged?`<div class="kv"><span class="k">Merged into an existing day</span><span class="v">${r.merged}</span></div>`:''}
      <div class="kv"><span class="k">Duplicates skipped</span><span class="v">${r.dupes}</span></div>
      ${r.naps?`<div class="kv"><span class="k">Naps skipped</span><span class="v">${r.naps}</span></div>`:''}
      ${r.bad?`<div class="kv"><span class="k">Rows without a usable date</span><span class="v">${r.bad}</span></div>`:''}
      ${r.days?`<div class="kv"><span class="k">Total days now held</span><span class="v">${r.days}</span></div>`:''}
    </div>`).join('')}
    ${ok.some(r=>r.merged)?`<div class="note" style="margin-top:10px">WHOOP sometimes records two physiological cycles inside one calendar day. This app is day-keyed — one readiness decision per day — so those rows were <b>merged</b>, with the row carrying the recovery score taking precedence. That is why the day count can be lower than the row count.</div>`:''}
    ${bad.map(r=>`<div class="card tight" style="border-color:rgba(242,99,95,.35)">
      <div style="font-weight:750;font-size:14px">${esc(r.file)}</div>
      <div class="note red" style="margin-top:8px">${esc(r.error)}</div></div>`).join('')}
    <div class="note acc" style="margin-top:12px"><b>${added}</b> new rows imported, <b>${dup}</b> duplicates skipped. Baselines have been recalculated from your most recent 90 cycles.</div>
  `,`<button class="btn primary big block" onclick="closeSheet()">Done</button>`,()=>render());
});

   </div>`:''}

   ${sa?`<div class="card" style="border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.05)">

/* =========================================================================

let W=null;            // live session state
let restTimer=null, restLeft=0;

function startWorkout(wid,variant,date,rec){
  const wk=DB.workouts.find(x=>x.id===wid); if(!wk){toast('Workout not found','err');return;}
  const blocks = sessionBlocks(Object.assign({addCore:false},rec||{},{workoutId:wid,variant}));
  if(!blocks.length){ toast('This version has no exercises','err'); return; }
  const rd=DB.checkins[date]?readiness(date,DB.checkins[date]):null;
  W={
    id:'s'+uid(), date:date||todayISO(), workoutId:wid,
    workoutName:wk.name+((rec&&rec.addCore)?' + Core':''), variant,
    category:(rec&&rec.id)?({lower:'lower',upper:'upper',power:'power',core:'core',
      run_e:'run',run_q:'run',run_int:'run',bike:'bike',mobility:'mobility'}[rec.id]||catOfWorkout(wk)):catOfWorkout(wk),
    addCore:!!(rec&&rec.addCore), recId:rec?rec.id:null, overridden:!!(rec&&rec.overridden),
    startedAt:Date.now(), time:new Date().toTimeString().slice(0,5),
    band:rd?rd.band:null, readinessScore:rd?rd.score:null,
    step:-1,   // -1 = warm-up screen
    entries: blocks.map(b=>{ const e=exOf(b.ex)||{name:'(missing)',sets:3,reps:'10'};
      const n=b.sets||e.sets||3;
      return { exerciseId:b.ex, name:e.name, plannedSets:n,
        plannedReps:b.reps||e.reps, plannedRpe:b.rpe||e.rpe, plannedRest:b.rest||e.rest,
        tempo:b.tempo||e.tempo||'', note:'', blockNote:b.note||'', cue:e.cue||'', subs:e.subs||'',
        skipped:false,
        sets:Array.from({length:n},()=>({reps:'',weight:'',rpe:'',done:false})) };})
  };
  $('#wmode').classList.add('on');
  document.body.style.overflow='hidden';
  drawWM();
}
function exitWM(discard){
  const fin=()=>{ $('#wmode').classList.remove('on'); document.body.style.overflow=''; stopRest(); W=null; render(); };
  const anyDone = W && W.entries.some(e=>e.sets.some(s=>s.done));
  if(discard||!anyDone) return fin();
  confirmSheet('Leave workout?','You have logged sets. Finish the session to save it, or discard and lose this log.','Discard',()=>{ fin(); },true);
}
function drawWM(){
  if(!W)return;
  const total=W.entries.length;
  const i=W.step;
  const doneSets=sum(W.entries.map(e=>e.sets.filter(s=>s.done).length));
  const allSets=sum(W.entries.map(e=>e.plannedSets));
  $('#wmProg').style.width=(allSets?doneSets/allSets*100:0)+'%';
  const elapsed=Math.round((Date.now()-W.startedAt)/60000);

  $('#wmHead').innerHTML=`
    <button class="icon-btn" id="wmX">${svg('x')}</button>
    <div style="flex:1;text-align:center">
      <div style="font-size:12.5px;font-weight:750;letter-spacing:-.1px">${esc(W.workoutName)}</div>
      <div style="font-size:10.5px;color:var(--text-3);font-weight:650;margin-top:1px">
        ${esc((W.variant||'full').toUpperCase())} · ${i<0?'warm-up':`exercise ${i+1}/${total}`} · ${elapsed} min</div>
    </div>
    <div class="icon-btn" style="font-size:11px;font-weight:800;color:var(--accent)">${doneSets}/${allSets}</div>`;
  $('#wmX').onclick=()=>exitWM();

  if(i<0) return drawWarmup();
  if(i>=total) return drawFinish();
  drawExercise(W.entries[i],i,total);
}
function drawWarmup(){
  const wk=DB.workouts.find(x=>x.id===W.workoutId);

  $('#wmBody').innerHTML=`

    </div>

function drawExercise(en,i,total){

    ${en.subs?`<div style="margin-top:11px"><div class="card-t" style="margin-bottom:6px">If this is not working today</div>
      <p style="font-size:12.5px;line-height:1.55;color:var(--text-3)">${esc(en.subs)}</p></div>`:''}`;

  const allDone=en.sets.every(s=>s.done);
  $('#wmFoot').innerHTML=`<div class="btn-row">
      ${i>0?`<button class="btn ghost" id="wmPrev">Back</button>`:''}
      <button class="btn ${allDone?'primary':'ghost'}" id="wmNext" style="flex:2">${i<total-1?(allDone?'Next exercise':'Skip to next'):'Finish workout'}</button>
    </div>`;

  $$('.wmIn').forEach(inp=>inp.addEventListener('input',()=>{
    const s=en.sets[+inp.dataset.s]; s[inp.dataset.k]=inp.value; saveLive();

      haptic();

      if(DB.settings.restTimerOn&&rest&&!(n===en.sets.length-1&&i===total-1)) startRest(rest,en.name,n+1,en.sets.length);

  $('#wmNext').onclick=nextStep;

function nextStep(){ stopRest(); W.step++; drawWM(); $('#wmBody').scrollTop=0; }
function parseRest(s){
  if(!s)return null;
  const m=String(s).match(/(\d+)\s*(s|min|m)?/i);
  if(!m)return null;
  let v=+m[1];
  if(/min|^m$/i.test(m[2]||''))v*=60;
  return v>0&&v<=600?v:null;
}
function drawFinish(){
  stopRest();
  const dur=Math.max(1,Math.round((Date.now()-W.startedAt)/60000));
  const setsDone=sum(W.entries.map(e=>e.sets.filter(s=>s.done).length));

  const rpes=[].concat(...W.entries.map(e=>e.sets.filter(s=>s.done&&s.rpe).map(s=>+s.rpe)));
  const avgRpe=rpes.length?rnd(mean(rpes),1):null;
  const skipped=W.entries.filter(e=>e.skipped);
  $('#wmBody').innerHTML=`
    <div style="text-align:center;padding:14px 0 6px">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="width:32px;height:32px">${ICON.check}</svg></div>

    ${W.entries.map(en=>{
      const done=en.sets.filter(s=>s.done);
      return `<div class="card tight">
        <div style="font-size:14px;font-weight:750;margin-bottom:6px">${esc(en.name)}
          ${en.skipped?'<span class="tag r">SKIPPED</span>':done.length<en.plannedSets?'<span class="tag o">PARTIAL</span>':'<span class="tag g">DONE</span>'}</div>
        <div class="kv"><span class="k">Planned</span><span class="v">${en.plannedSets} × ${esc(en.plannedReps)}</span></div>
        <div class="kv"><span class="k">Actual</span><span class="v">${done.length?done.map(s=>s.reps+(s.weight?'×'+s.weight+'kg':'')).join(' · '):'—'}</span></div>
      </div>`;}).join('')}
    <div class="field" style="margin-top:16px"><label>Session RPE — how hard overall?</label>
      <div class="slider-row" style="margin-bottom:8px">
        <div class="slider-top"><span class="l">Overall effort</span><span class="v num" id="fRpe_o">${avgRpe||7}</span></div>
        <input type="range" id="fRpe" min="1" max="10" step="1" value="${Math.round(avgRpe||7)}" data-out="fRpe_o">
        <div class="scale"><span>Very easy</span><span>Maximal</span></div></div></div>
    <div class="field"><label>Session notes</label>
      <textarea class="inp" id="fNotes" placeholder="How did it feel? Anything to remember for next time?"></textarea></div>
    ${skipped.length?`<div class="note warn">${skipped.length} exercise${skipped.length>1?'s':''} skipped. That is recorded rather than hidden — it is useful signal, not a failure.</div>`:''}`;
  $('#wmFoot').innerHTML=`<button class="btn primary big block" id="fSave">Save session</button>`;
  bindInputs($('#wmBody'));
  $('#fSave').onclick=()=>{
    W.done=true; W.endedAt=Date.now(); W.durationMin=dur; W.setsDone=setsDone; W.volume=rnd(vol,1);
    W.sessionRpe=+$('#fRpe').value; W.notes=$('#fNotes').value.trim();

    DB.sessions.push(JSON.parse(JSON.stringify(W)));
    DB.sessions.sort((a,b)=>a.date<b.date?-1:1);
    Store.pref('live',null);
    save(true); toast('Session saved','ok');

function saveLive(){ try{ Store.pref('live',JSON.stringify(W)); }catch(e){} }

/* ---- rest timer ----
   Driven by a target timestamp, not by decrementing a counter. iOS Safari
   throttles or suspends timers when you lock the screen or switch apps, so a
   counting-down variable would drift badly; a deadline stays correct. */
let restEnd=0, restDone=false;
function restRemaining(){ return Math.max(0,(restEnd-Date.now())/1000); }
function paintRest(){
  const r=restRemaining();
  const t=$('#restT'); if(t) t.textContent=mmss(r);
  if(r<=0&&!restDone){ restDone=true; haptic(); toast('Rest complete — next set'); stopRest(); }
}
function startRest(sec,name,n,of){
  restEnd=Date.now()+sec*1000; restDone=false;
  $('#rest').classList.add('on');
  $('#restL').innerHTML=`Rest after set ${n} of ${of}<br><span style="color:var(--text-2)">${esc(name)}</span>`;
  paintRest(); clearInterval(restTimer); restTimer=setInterval(paintRest,250);
}
function stopRest(){ clearInterval(restTimer); restTimer=null; restEnd=0; $('#rest').classList.remove('on'); }
$('#restSkip').onclick=stopRest;
$('#restAdd').onclick=()=>{ if(!restEnd)return; restEnd+=30000; restDone=false; paintRest(); };

/* =========================================================================
   EXPORT / IMPORT
   ====================================================================== */
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },400);
}
function exportJSON(){
  const c=Store.counts();
  const payload={
    _app:'baseline.tps', _version:DB.version, _schema:SCHEMA_VERSION,
    _exported:new Date().toISOString(),
    _counts:c,
    _note:'Private local backup from Baseline. Contains your own fitness data only. Nothing was uploaded anywhere.',
    data:DB
  };
  download('baseline-backup-'+todayISO()+'.json',JSON.stringify(payload,null,1));
  DB.meta.lastBackup=new Date().toISOString();
  DB.meta.lastBackupCount=c;
  save(true);
  toast('Backup downloaded','ok');
  if(TAB==='settings') setTimeout(render,300);
}
function exportWhoopCSV(){

/* =========================================================================
   MIGRATION / BOOT
   ====================================================================== */
function migrate(d){
  const f=freshDB();
  const out=Object.assign({},f,d);
  out.profile=Object.assign({},f.profile,d.profile||{});
  out.settings=Object.assign({},f.settings,d.settings||{});
  out.settings.bands=Object.assign({},f.settings.bands,(d.settings||{}).bands||{});
  out.baselines=Object.assign({},f.baselines,d.baselines||{});
  out.whoop=Object.assign({cycles:[],workouts:[],journal:[],imports:[]},d.whoop||{});
  out.targets=Object.assign({},f.targets,d.targets||{});
  /* the fixed weekly calendar was replaced by the daily decision engine */
  delete out.schedule; delete out.altSchedule; delete out.tennisDays;
  ['exercises','workouts','sessions','tests','physique','activities'].forEach(k=>{
    if(!Array.isArray(out[k])) out[k]=f[k];
  });
  out.checkins=out.checkins&&typeof out.checkins==='object'?out.checkins:{};
  out.plans=out.plans&&typeof out.plans==='object'?out.plans:{};
  out.meta=Object.assign({},f.meta,d.meta||{});
  /* schema migrations — additive, never destructive */
  const from=(d.meta&&d.meta.schema)||1;
  if(from<2){
    /* v1 shipped one person's baselines as defaults; drop them unless the
       device actually holds the WHOOP data they were computed from */
    const n=(out.whoop&&out.whoop.cycles)?out.whoop.cycles.length:0;
    if(n<14) out.baselines=Object.assign({},f.baselines);
    if(!out.profile.mode) out.profile.mode = n>=14?'whoop':'manual';
    /* an existing install has already been set up — do not re-ask the mode
       question. Check the INCOMING profile, not the merged one, because the
       fresh defaults would otherwise mask it. */
    if(!d.profile || d.profile.onboarded===undefined) out.profile.onboarded=true;
  }
  /* Single sport/physique became multi-select. Trust the arrays only if the
     SAVED data had them — otherwise the fresh defaults would mask the user's
     real single value and silently reset everyone to tennis. */
  const inP=d.profile||{};
  out.profile.sports = (Array.isArray(inP.sports)&&inP.sports.length)
    ? inP.sports.slice() : [inP.sport||out.profile.sport||'tennis'];
  out.profile.physiques = (Array.isArray(inP.physiques)&&inP.physiques.length)
    ? inP.physiques.slice() : [inP.physique||out.profile.physique||'athletic'];
  out.profile.sport=out.profile.sports[0];
  out.profile.physique=out.profile.physiques[0];
  out.meta.schema=SCHEMA_VERSION;
  // legacy: fold old separate tennis/cardio logs into the unified activity log
  if(Array.isArray(d.tennis)) d.tennis.forEach(t=>out.activities.push({
    id:t.id||'a'+uid(),date:t.date,type:'tennis',min:t.min,rpe:t.rpe,subtype:t.type||null,
    intensity:t.intensity||'Moderate',planned:true,notes:t.notes||''}));
  if(Array.isArray(d.cardio)) d.cardio.forEach(t=>out.activities.push({
    id:t.id||'a'+uid(),date:t.date,type:t.mode==='bike'?'cycling':'running',min:t.min,dist:t.distance||null,
    rpe:t.rpe,intensity:'Moderate',planned:true,notes:t.notes||''}));
  delete out.tennis; delete out.cardio;
  // older exports had w_aerobic / w_interval; make sure the cardio set exists
  const have=new Set(out.workouts.map(w=>w.id));
  seedWorkouts().forEach(sw=>{ if(!have.has(sw.id)) out.workouts.push(sw); });
  const exHave=new Set(out.exercises.map(e=>e.id));
  seedExercises().forEach(se=>{ if(!exHave.has(se.id)) out.exercises.push(se); });
  // repair any workout whose exercises no longer exist
  const ids=new Set(out.exercises.map(e=>e.id));
  out.workouts.forEach(w=>{
    if(!w.blocks) w.blocks={full:[],reduced:[],recovery:[]};
    ['full','reduced','recovery'].forEach(v=>{
      if(!Array.isArray(w.blocks[v])) w.blocks[v]=[];
      w.blocks[v]=w.blocks[v].filter(b=>ids.has(b.ex));
    });
    if(!w.est) w.est={full:40,reduced:28,recovery:18};
  });
  // backfill session categories so week accounting works on old history
  out.sessions.forEach(s=>{
    if(!s.category) s.category=catOfWorkout(out.workouts.find(w=>w.id===s.workoutId));
  });
  out.version=f.version;
  return out;
}

/* A blank screen is the worst possible failure, so boot is defensive:
   every async step has a deadline, the whole thing is wrapped, and a watchdog
   force-renders if anything still manages to stall. */
let BOOTED=false;
function bootFallback(reason){
  if(BOOTED) return;
  BOOTED=true;
  try{
    if(!DB) DB=freshDB();
    TAB='today'; renderNav(); render(); updateBanner();
    const b=document.getElementById('sbanner');
    if(b&&!b.classList.contains('on')){
      b.className='on';
      b.innerHTML=`<b>Started in recovery mode.</b> Something failed while loading (${esc(reason||'unknown')}), so defaults were used.
        If you had data saved, do not enter anything yet — reload once, and restore a JSON backup if it is still missing.`;
    }
  }catch(e){
    document.getElementById('view').innerHTML =
      '<div class="empty"><div class="ei">⚠️</div><h4>Could not start</h4>'+
      '<p>Reload the page. If this persists, the saved data may be corrupt — '+
      'restore a JSON backup from Settings after reloading.</p></div>';
  }
}
setTimeout(()=>{ if(!DB) bootFallback('startup timed out'); },6000);

/* rebuild the in-memory model from the IndexedDB stores */
function hydrate(loaded){
  if(!loaded) return null;
  if(loaded.legacy) return loaded.legacy;              // v1 single-blob install
  const f=freshDB(), kv=loaded.kv||{}, c=loaded.cols||{};
  const out=Object.assign({},f);
  KV_KEYS.forEach(k=>{ if(kv[k]) out[k]=kv[k]; });
  ['sessions','activities','exercises','workouts','tests','physique'].forEach(k=>{
    if(c[k]&&c[k].length) out[k]=c[k];
  });
  if(c.checkins&&c.checkins.length){
    out.checkins={};
    c.checkins.forEach(r=>{ const d=r.date; out.checkins[d]=r; });
  }
  out.whoop={
    cycles:c.wCycles||[], workouts:c.wWorkouts||[],
    journal:c.wJournal||[], imports:c.wImports||[]
  };
  out.whoop.cycles.sort((a,b)=>a.date<b.date?-1:1);
  return out;
}

async function boot(){
  try{ await withTimeout(Store.init(),5000,null); }catch(e){}
  let loaded=null;
  try{ loaded=await withTimeout(Store.loadAll(),6000,null); }catch(e){}
  const raw=hydrate(loaded);
  DB = raw ? migrate(raw) : freshDB();
  BOOTED=true;
  /* a legacy localStorage install is rewritten into IndexedDB once */
  if(loaded&&loaded.legacy){ save(true,true); toast('Data upgraded to IndexedDB','ok'); }
  else if(!raw) save(true,true);
  if(DB.whoop.cycles.length>=14) recomputeBaselines();
  TAB = (DB.ui&&DB.ui.tab)||'today';
  if(!TABS.some(t=>t.id===TAB)) TAB='today';
  renderNav(); render(); updateBanner();

  // recover an interrupted workout
  try{
    const lv=Store.pref('live');
    const live=lv?JSON.parse(lv):null;
    if(live&&live.date===todayISO()&&!live.done&&live.entries&&live.entries.some(e=>e.sets.some(s=>s.done))){
      setTimeout(()=>confirmSheet('Resume workout?',
        `You left <b>${esc(live.workoutName)}</b> partway through with sets already logged. Pick it back up?`,
        'Resume',()=>{ W=live; W.startedAt=Date.now()-((live.endedAt||Date.now())-live.startedAt);
          $('#wmode').classList.add('on'); document.body.style.overflow='hidden'; drawWM(); }),600);
    } else if(live){ Store.pref('live',null); }
  }catch(e){}

  if(!DB.profile.onboarded) setTimeout(()=>startSetup(),350);
  else if(!Store.durable) setTimeout(()=>openSetup(true),500);
}
/* =========================================================================
   SERVICE WORKER — offline support
   Only registers on a secure origin where sw.js was actually deployed
   alongside this file. Everything is fire-and-forget: a missing or failing
   service worker must never affect the app, which works fine without one.
   ====================================================================== */
const SW={state:'unknown', scope:null};
function registerSW(){
  if(!('serviceWorker' in navigator)){ SW.state='unsupported'; return; }
  if(!window.isSecureContext || location.protocol==='file:'){ SW.state='insecure-origin'; return; }
  navigator.serviceWorker.register('sw.js',{scope:'./'})
    .then(reg=>{
      SW.state='registered'; SW.scope=reg.scope;
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed'&&navigator.serviceWorker.controller){
            SW.state='update-ready';
            toast('Update downloaded — reopen the app to apply');
          }
        });
      });
    })
    .catch(e=>{ SW.state='not-deployed'; SW.err=(e&&e.message)||String(e); });
  navigator.serviceWorker.ready.then(()=>{ if(SW.state==='registered') SW.state='active'; }).catch(()=>{});
}

/* any unexpected throw inside boot must still leave a usable app */
boot()
  .catch(e=>{ console.error('boot failed',e); bootFallback((e&&e.message)||'error'); })
  .then(()=>{ try{ registerSW(); }catch(e){} });

  /* ---------------- 5 · schedule ---------------- */
  if(s===5){
    title='How much can you train?';
    body=head+`
     <div class="field"><label>Days per week you can train</label>
       <div class="pills" id="setDays">${[2,3,4,5,6].map(n=>`<button data-v="${n}" class="${d.daysPerWeek===n?'on':''}">${n} days</button>`).join('')}</div>
       <div class="hint">A guideline for the weekly targets. The engine will still tell you to rest when your recovery says so.</div>
     </div>
     <div class="field"><label>Typical session length</label>
       <div class="pills" id="setMin">${[20,30,45,60,75].map(n=>`<button data-v="${n}" class="${d.sessionMin===n?'on':''}">${n} min</button>`).join('')}</div>
     </div>
     <div class="divider"></div>
     <div class="card tight">
       <div class="card-t accent" style="margin-bottom:10px">Your setup</div>
       <div class="kv"><span class="k">Data source</span><span class="v">${d.mode==='whoop'?'WHOOP + manual logs':'Manual logs only'}</span></div>
       <div class="kv"><span class="k">Equipment</span><span class="v">${esc((TIERS.find(t=>t.id===d.tier)||TIERS[0]).name)}</span></div>
       <div class="kv"><span class="k">Exercises available</span><span class="v">${DB.exercises.filter(e=>(e.tier||0)<=d.tier).length}</span></div>
       <div class="kv"><span class="k">Training for</span><span class="v">${esc(d.sports.map(id=>(SPORTS.find(x=>x.id===id)||{}).name).filter(Boolean).join(', '))}</span></div>
       <div class="kv"><span class="k">Goals</span><span class="v">${esc(d.physiques.map(id=>(PHYSIQUES.find(x=>x.id===id)||{}).name).filter(Boolean).join(', '))}</span></div>
       <div class="kv"><span class="k">Schedule</span><span class="v">${d.daysPerWeek} days × ${d.sessionMin} min</span></div>
       ${d.age?`<div class="kv"><span class="k">Age / height / weight</span><span class="v">${d.age} · ${d.heightCm||'—'} cm · ${d.weightKg||'—'} kg</span></div>`:''}
     </div>`;
  }

  const back = s>0 ? `<button class="btn ghost" id="setBack">Back</button>` : '';
  const nextLabel = s===SETUP_STEPS.length-1 ? (d.mode==='whoop'?'Finish & import WHOOP':'Finish setup') : 'Continue';
  /* closing the wizard leaves the program on defaults — say so rather than
     letting it vanish and quietly prescribe the wrong exercises */
  openSheet(title, body,
    `<div class="btn-row">${back}<button class="btn primary" id="setNext" style="flex:2">${nextLabel}</button></div>`,
    ()=>{ if(!DB.profile.onboarded){ try{ render(); toast('Setup unfinished — finish it from the card on Today'); }catch(e){} } });

  /* single-choice cards */
  $$('.setOpt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; let v=b.dataset.v;
    if(k==='tier') v=+v;
    SETUP.draft[k]=v; haptic(); drawSetup();
  });
  /* multi-choice cards — toggle, first pick leads, never allow empty */
  $$('.setMulti').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, v=b.dataset.v, arr=SETUP.draft[k];
    const i=arr.indexOf(v);
    if(i>=0){
      if(arr.length===1){ toast('Keep at least one'); return; }
      arr.splice(i,1);
    } else arr.push(v);
    haptic(); drawSetup();
  });
  /* free fields */
  $$('.setF').forEach(i=>i.oninput=()=>{
    const k=i.dataset.k;
    SETUP.draft[k] = i.type==='number' ? (i.value===''?null:parseFloat(i.value)) : i.value;
  });
  const pill=(sel,k,num)=>{ const el2=$(sel); if(!el2)return;
    $$(sel+' button').forEach(b=>b.onclick=()=>{
      $$(sel+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      SETUP.draft[k]= num ? +b.dataset.v : b.dataset.v; haptic(); }); };
  pill('#setSex','sex'); pill('#setUnits','units');
  pill('#setDays','daysPerWeek',true); pill('#setMin','sessionMin',true);

  const bk=$('#setBack'); if(bk) bk.onclick=()=>{ SETUP.step--; drawSetup(); };
  $('#setNext').onclick=()=>{
    if(SETUP.step===0 && !SETUP.draft.mode){ toast('Pick one to continue','err'); return; }
    if(SETUP.step<SETUP_STEPS.length-1){ SETUP.step++; drawSetup(); return; }
    finishSetup();
  };
}

function finishSetup(){
  const d=SETUP.draft, P=DB.profile;
  P.mode=d.mode; P.age=d.age; P.sex=d.sex; P.heightCm=d.heightCm; P.weightKg=d.weightKg;
  P.tier=d.tier;
  P.sports=d.sports.slice(); P.sport=d.sports[0];          // sport = the leading one
  P.physiques=d.physiques.slice(); P.physique=d.physiques[0];
  P.daysPerWeek=d.daysPerWeek; P.sessionMin=d.sessionMin; P.units=d.units;
  if(d.equipNote) P.equipNote=d.equipNote;
  P.equipment=equipmentList(d.tier, d.equipNote);
  P.goalPrimary=goalTextFor(d.sports);
  P.goalSecondary=d.physiques.map(id=>(PHYSIQUES.find(x=>x.id===id)||{}).desc).filter(Boolean).join(' ');
  P.onboarded=true;
  applyGoalTargets();
  save(true); closeSheet(); renderNav();
  const wasSettings=SETUP.fromSettings;
  setTimeout(()=>{
    if(d.mode==='whoop' && !hasWhoop()){ HTAB='import'; go('whoop'); toast('Import your WHOOP CSVs to finish'); }
    else { go('today'); toast('Setup complete','ok'); }
    if(!wasSettings && d.mode!=='whoop') setTimeout(welcome,400);
  },240);
}
function equipmentList(tier, note){
  const base=['Bodyweight','Resistance band','Open space for running','Bicycle'];
  if(tier>=0) base.splice(1,0,'Light dumbbells');
  if(tier>=1) base.push('Bench or sturdy step','Pull-up bar','Adjustable dumbbells');
  if(tier>=2) base.push('Barbell and rack','Cable machine','Gym machines');
  if(note) base.push(note);
  return base;
}
function goalTextFor(sportIds){
  const ids=Array.isArray(sportIds)?sportIds:[sportIds];
  const list=ids.map(id=>SPORTS.find(x=>x.id===id)).filter(Boolean);
  if(!list.length) return 'Build balanced strength, conditioning and movement quality.';
  if(list.length===1){
    return list[0].id==='general'
      ? 'Build balanced strength, conditioning and movement quality.'
      : `Improve ${list[0].name.toLowerCase()} performance. ${list[0].focus}`;
  }
  const names=list.map(s=>s.name.toLowerCase());
  return `Improve performance across ${names.slice(0,-1).join(', ')} and ${names[names.length-1]}, `+
         `led by ${names[0]}. ${list[0].focus}`;
}
/* Goals shape the weekly targets. With several sports selected the shared
   qualities (legs, core, conditioning) take priority and sport-specific work
   is spread thinner — the leading sport still decides ties. */
function applyGoalTargets(){
  const P=DB.profile, days=P.daysPerWeek||4, T=DB.targets;
  const sports=(P.sports&&P.sports.length)?P.sports:[P.sport||'tennis'];
  const goals =(P.physiques&&P.physiques.length)?P.physiques:[P.physique||'athletic'];
  const has=x=>sports.indexOf(x)>=0;
  const wants=x=>goals.indexOf(x)>=0;

  const lower = days<=3?1:2;
  const upper = days<=3?1:2;
  T.lower=lower; T.upper=upper;
  /* explosive sports need power work; more of them does not mean more sessions */
  const explosive = has('tennis')||has('football')||has('basketball')||has('racquet');
  T.power = explosive && days>=4 ? 1 : (days>=5?1:0);
  T.core  = Math.min(4, Math.max(2, days-1));
  T.run   = has('running') ? Math.min(4,days-1)
          : (sports.length===1&&has('cycling')) ? 0
          : (days>=4?2:1);
  T.bike  = has('cycling') ? Math.min(4,days-1) : (days>=4?2:1);
  T.mobility = Math.max(2, days-1);

  if(wants('muscle')){ T.upper=Math.min(3,T.upper+1); if(!wants('lean')) T.run=Math.max(0,T.run-1); }
  if(wants('lean')){ T.run=T.run+1; T.bike=T.bike+1; }
  if(wants('perform')&&!wants('muscle')) T.upper=Math.max(1,T.upper);

  /* more sports than training days means something has to give */
  if(sports.length>=3&&days<=3){ T.power=0; T.upper=1; }
}

function welcome(){
  openSheet('Welcome to Baseline',`
   <p style="font-size:14.5px;line-height:1.6;color:var(--text-2)">A tennis-first training system built around <b>your</b> physiology, with no gym required — bodyweight, two 5 kg dumbbells, one band, a bike and open space.</p>
   <div class="card tight" style="margin-top:16px">
     <div class="card-t accent" style="margin-bottom:9px">What you get</div>
     <div class="kv"><span class="k">Exercises</span><span class="v">${DB.exercises.length}, no gym needed</span></div>
     <div class="kv"><span class="k">Sessions</span><span class="v">${DB.workouts.length} with full/reduced/recovery versions</span></div>
     <div class="kv"><span class="k">Daily engine</span><span class="v">Picks one session for you</span></div>
     <div class="kv"><span class="k">Activity log</span><span class="v">${Object.keys(ACT_TYPES).length} activity types</span></div>
     <div class="hint" style="margin-top:9px">Built around bodyweight, 2 × 5 kg dumbbells, a band, a bike and open space. Change the equipment list in Settings if yours differs.</div>
   </div>
   <div style="margin-top:16px">
     <div class="card-t" style="margin-bottom:10px">Three things to do first</div>
     <ul class="why" style="border:none;padding:0;margin:0">
       ${Store.durable
         ? `<li class="info"><span class="dot"></span><span><b>Settings → Setup</b> — add this to your Home Screen so it runs full-screen like an app.</span></li>`
         : `<li class="neg"><span class="dot"></span><span><b>Settings → Setup</b> — storage is currently blocked, so nothing will be saved. Fix this first; it takes two minutes.</span></li>`}
       <li class="info"><span class="dot"></span><span><b>WHOOP → Import</b> — load your CSV export so trends and baselines are real rather than seeded.</span></li>
       <li class="info"><span class="dot"></span><span><b>Today → Daily check-in</b> — 60 seconds, and the engine tells you exactly what to train.</span></li>
     </ul>
   </div>
   <div class="note warn" style="margin-top:16px">Not a medical device. It does not diagnose anything. Persistent pain, symptoms or unusual readings belong with a qualified healthcare professional, separately from any training decision.</div>
  `,`<div class="btn-row"><button class="btn ghost" id="wlSetup">Setup</button>
     <button class="btn primary" style="flex:2" onclick="closeSheet()">Get started</button></div>`);
  $('#wlSetup').onclick=()=>{ closeSheet(); setTimeout(()=>openSetup(),260); };
}

/* ---- iOS lifecycle ----
   Safari suspends background tabs and does not reliably fire beforeunload, so
   state is flushed on pagehide and on every hide, and the rest timer is
   recomputed from its deadline whenever the app comes back. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(DB) save(true); if(W) saveLive(); }
  else { if(restEnd) paintRest(); if(W) drawWM(); updateBanner(); }
});
window.addEventListener('pagehide',()=>{ if(DB) save(true); if(W) saveLive(); });
window.addEventListener('beforeunload',()=>{ if(DB) save(true); });
/* orientation changes need a relayout of the charts and grids */
let orT;
window.addEventListener('orientationchange',()=>{ clearTimeout(orT); orT=setTimeout(()=>{ if(DB&&!W) render(); },260); });
window.addEventListener('resize',()=>{ clearTimeout(orT); orT=setTimeout(()=>{ if(DB&&!W) render(); },400); });
</script>
</body>
