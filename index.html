function editWorkout(wid){
  const w=DB.workouts.find(x=>x.id===wid); if(!w)return;
  let V='full';
  const draw=()=>{
    const blocks=w.blocks[V];
    openSheet('Edit · '+w.name,`
     <div class="field"><label>Workout name</label><input class="inp" id="ewName" value="${esc(w.name)}"></div>
     <div class="grid2">
       <div class="field"><label>Short name</label><input class="inp" id="ewShort" value="${esc(w.short)}"></div>
       <div class="field"><label>Type</label><select class="inp" id="ewType">
         ${['strength','power','core','cardio','mobility','tennis'].map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}
       </select></div>
     </div>
     <div class="field"><label>Focus</label><input class="inp" id="ewFocus" value="${esc(w.focus)}"></div>
     <div class="field"><label>Description</label><textarea class="inp" id="ewDesc">${esc(w.desc||'')}</textarea></div>
     <div class="grid2">
       <div class="field"><label>Warm-up</label><select class="inp" id="ewWarm">
         ${Object.keys(WARMUPS).map(k=>`<option value="${k}" ${w.warm===k?'selected':''}>${esc(WARMUPS[k].name)}</option>`).join('')}</select></div>
       <div class="field"><label>Cool-down</label><select class="inp" id="ewCool">
         ${Object.keys(COOLDOWNS).map(k=>`<option value="${k}" ${w.cool===k?'selected':''}>${esc(COOLDOWNS[k].name)}</option>`).join('')}</select></div>
     </div>
     <div class="grid3">
       <div class="field"><label>Full min</label><input class="inp num" type="number" id="ewEf" value="${w.est.full}"></div>
       <div class="field"><label>Red. min</label><input class="inp num" type="number" id="ewEr" value="${w.est.reduced}"></div>
       <div class="field"><label>Rec. min</label><input class="inp num" type="number" id="ewEc" value="${w.est.recovery}"></div>
     </div>
     <div class="divider"></div>
     <div class="card-t" style="margin-bottom:10px">Exercises — which version?</div>
     <div class="seg sm" id="ewSeg" style="margin-bottom:12px">
       ${['full','reduced','recovery'].map(x=>`<button data-v="${x}" class="${x===V?'on':''}">${x.toUpperCase()} (${w.blocks[x].length})</button>`).join('')}
     </div>
     ${blocks.length?blocks.map((b,i)=>{ const e=exOf(b.ex);
       return `<div class="card tight" style="margin-bottom:8px">
         <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
           <b style="flex:1;font-size:13.5px">${i+1}. ${e?esc(e.name):'<span style="color:var(--red)">Missing exercise</span>'}</b>
           <button class="icon-btn" style="width:32px;height:32px" data-up="${i}">${svg('up')}</button>
           <button class="icon-btn" style="width:32px;height:32px" data-dn="${i}">${svg('down2')}</button>
           <button class="icon-btn" style="width:32px;height:32px;color:var(--red)" data-rm="${i}">${svg('trash')}</button>
         </div>
         <div class="grid2">
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">SETS</label>
             <input class="inp bEdit" data-i="${i}" data-k="sets" type="number" inputmode="numeric" value="${b.sets||''}" placeholder="${e?e.sets:''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">REPS</label>
             <input class="inp bEdit" data-i="${i}" data-k="reps" value="${esc(b.reps||'')}" placeholder="${e?esc(e.reps):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">RPE / RIR</label>
             <input class="inp bEdit" data-i="${i}" data-k="rpe" value="${esc(b.rpe||'')}" placeholder="${e?esc(e.rpe):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">REST</label>
             <input class="inp bEdit" data-i="${i}" data-k="rest" value="${esc(b.rest||'')}" placeholder="${e?esc(e.rest):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">TEMPO</label>
             <input class="inp bEdit" data-i="${i}" data-k="tempo" value="${esc(b.tempo||'')}" placeholder="${e&&e.tempo?esc(e.tempo):'—'}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">NOTE</label>
             <input class="inp bEdit" data-i="${i}" data-k="note" value="${esc(b.note||'')}" placeholder="optional"></div>
         </div></div>`;}).join('')
      :'<div class="empty"><p>No exercises in this version. Add one below.</p></div>'}
     <button class="btn ghost block" id="ewAdd" style="margin-top:10px">${svg('plus')} Add exercise</button>
     <div class="divider"></div>
     <button class="btn danger block" id="ewDel">${svg('trash')} Delete this workout</button>
    `,`<button class="btn primary big block" id="ewSave">Save workout</button>`);

    $$('#ewSeg button').forEach(b=>b.onclick=()=>{ commit(); V=b.dataset.v; draw(); });
    $$('[data-up]').forEach(b=>b.onclick=()=>{ commit(); const i=+b.dataset.up; if(i>0){ const a=w.blocks[V]; [a[i-1],a[i]]=[a[i],a[i-1]]; save(); draw(); }});
    $$('[data-dn]').forEach(b=>b.onclick=()=>{ commit(); const i=+b.dataset.dn; const a=w.blocks[V]; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; save(); draw(); }});
    $$('[data-rm]').forEach(b=>b.onclick=()=>{ commit(); w.blocks[V].splice(+b.dataset.rm,1); save(); draw(); });
    $('#ewAdd').onclick=()=>{ commit(); pickExercise(exid=>{ const e=exOf(exid);
      w.blocks[V].push({ex:exid,sets:e.sets,reps:e.reps,rpe:e.rpe,rest:e.rest,tempo:e.tempo||''}); save(); draw(); }); };
    $('#ewDel').onclick=()=>confirmSheet('Delete workout?',
      `<b>${esc(w.name)}</b> will be removed. Sessions you already completed with it stay in your history.`,'Delete',()=>{
        DB.workouts=DB.workouts.filter(x=>x.id!==wid);
        for(const k in DB.plans) if(DB.plans[k]&&DB.plans[k].workoutId===wid) delete DB.plans[k];
        save(true); toast('Workout deleted'); render();
      },true);
    $('#ewSave').onclick=()=>{ commit(); save(true); closeSheet(); toast('Saved','ok'); setTimeout(render,240); };
  };
  const commit=()=>{
    if(!$('#ewName'))return;
    w.name=$('#ewName').value.trim()||w.name; w.short=$('#ewShort').value.trim()||w.short;
    w.type=$('#ewType').value; w.focus=$('#ewFocus').value.trim(); w.desc=$('#ewDesc').value.trim();
    w.warm=$('#ewWarm').value; w.cool=$('#ewCool').value;
    w.est={full:+$('#ewEf').value||40,reduced:+$('#ewEr').value||28,recovery:+$('#ewEc').value||18};
    $$('.bEdit').forEach(inp=>{ const b=w.blocks[V][+inp.dataset.i]; if(!b)return;
      const k=inp.dataset.k, val=inp.value.trim();
      if(k==='sets') b.sets=val?+val:null; else b[k]=val; });
  };
  draw();
}

              <span class="tag ${e.cat==='lower'?'a':e.cat==='push'||e.cat==='pull'?'c':e.cat==='core'?'v':e.cat==='plyo'||e.cat==='speed'?'o':'g'}">${esc(CATNAME[e.cat]||e.cat)}</span>

        </div>
      </div>`).join('')||'<div class="empty"><h4>Nothing found</h4><p>Try a different search.</p></div>'}`;

function exerciseSheet(id,editMode){

  if(!editMode){
    const used=DB.workouts.filter(w=>['full','reduced','recovery'].some(v=>w.blocks[v].some(b=>b.ex===id)));

    openSheet(e.name,`
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <span class="tag a">${esc(CATNAME[e.cat]||e.cat)}</span>
        <span class="tag">${e.sets} × ${esc(e.reps)}</span>
        <span class="tag">${esc(e.rpe)}</span>
        <span class="tag">REST ${esc(e.rest)}</span>
        ${e.tempo?`<span class="tag c">TEMPO ${esc(e.tempo)}</span>`:''}
      </div>
      ${e.muscles?`<div class="kv"><span class="k">Muscles</span><span class="v">${esc(e.muscles)}</span></div>`:''}
      ${e.equip?`<div class="kv"><span class="k">Equipment</span><span class="v">${esc((e.equip||'').split('+').map(x=>EQ[x]||x).join(' + '))}</span></div>`:''}

      ${e.cue?`<div class="note acc" style="margin-top:13px"><b>Coaching cue:</b> ${esc(e.cue)}</div>`:''}
      ${e.notes?`<div class="note warn" style="margin-top:10px">${esc(e.notes)}</div>`:''}
      ${e.prog?`<div style="margin-top:16px"><div class="card-t" style="margin-bottom:7px">Progression</div>
        <p style="font-size:13px;line-height:1.55;color:var(--text-2)">${esc(e.prog)}</p></div>`:''}
      ${e.reg?`<div style="margin-top:13px"><div class="card-t" style="margin-bottom:7px">Regression (make it easier)</div>
        <p style="font-size:13px;line-height:1.55;color:var(--text-2)">${esc(e.reg)}</p></div>`:''}
      ${e.subs?`<div style="margin-top:13px"><div class="card-t" style="margin-bottom:7px">Substitutions</div>

        <div style="display:flex;gap:6px;flex-wrap:wrap">${used.map(w=>`<span class="chip">${esc(w.short)}</span>`).join('')}</div></div>`:''}
      ${hist.length?`<div style="margin-top:16px"><div class="card-t" style="margin-bottom:7px">Your recent sets</div>
        ${hist.map(s=>{ const en=s.entries.find(x=>x.exerciseId===id);
          const sets=en.sets.filter(x=>x.done);
          return `<div class="kv"><span class="k">${fmtDate(s.date)}</span><span class="v">${sets.map(x=>x.reps+(x.weight?'×'+x.weight+'kg':'')).join(' · ')||'—'}</span></div>`;}).join('')}
      </div>`:''}
    `,`<div class="btn-row"><button class="btn ghost" id="exDup">${svg('copy')} Duplicate</button>
       <button class="btn primary" id="exEdit">${svg('edit')} Edit</button></div>`);
    $('#exEdit').onclick=()=>exerciseSheet(id,true);
    $('#exDup').onclick=()=>{ const n=Object.assign({},e,{id:'x'+uid(),name:e.name+' (copy)',custom:true});
      DB.exercises.push(n); save(true); toast('Duplicated','ok'); exerciseSheet(n.id,true); };

  openSheet('Edit · '+e.name,`
    <div class="field"><label>Category</label><select class="inp" id="fcat">
      ${Object.keys(CATNAME).map(k=>`<option value="${k}" ${e.cat===k?'selected':''}>${esc(CATNAME[k])}</option>`).join('')}

  $('#exSave').onclick=()=>{

    $$('.exF').forEach(i=>{ const k=i.dataset.k; e[k]= k==='sets' ? (+i.value||1) : i.value.trim(); });
    save(true); closeSheet(); toast('Saved','ok'); setTimeout(render,240);
  };
  $('#exDel').onclick=()=>{
    const used=DB.workouts.filter(w=>['full','reduced','recovery'].some(v=>w.blocks[v].some(b=>b.ex===id)));
    confirmSheet('Delete exercise?',
      used.length?`<b>${esc(e.name)}</b> is used in ${used.length} workout${used.length>1?'s':''} (${used.map(w=>esc(w.short)).join(', ')}). It will be removed from them too.`
                 :`<b>${esc(e.name)}</b> will be permanently removed.`,'Delete',()=>{
      DB.exercises=DB.exercises.filter(x=>x.id!==id);
      DB.workouts.forEach(w=>['full','reduced','recovery'].forEach(v=>{ w.blocks[v]=w.blocks[v].filter(b=>b.ex!==id); }));
      save(true); toast('Deleted'); render();
    },true);
  };
}

function paneTimeline(c){

    const dd=dayDemand(d), ci=DB.checkins[d], cy=cycleByDate(d);
    const dow=dowOf(d);
    const plan=DB.plans[d];
    const planned=plan&&plan.workoutId?DB.workouts.find(w=>w.id===plan.workoutId):null;
    const didSession=DB.sessions.some(s=>s.date===d&&s.done);
    const b=loadBand(dd.load);
    const isToday=d===todayISO();
    const rows=[];
    if(plan && !didSession && d<=todayISO()){
      rows.push({time:'—',label:'Planned · '+(plan.label||(planned?planned.short:'session')),sub:'not completed',cls:'miss'});
    }

          <div class="rt"><div class="rn" style="font-size:13.5px;${r.cls==='miss'?'color:var(--text-3)':''}">${r.label}</div>
            ${r.sub?`<div class="rs">${esc(r.sub)}</div>`:''}</div>

       :'<div style="font-size:12.5px;color:var(--text-3);padding:6px 0">Nothing logged.</div>'}
      ${dd.n?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">

/* ---------------------------------------------------------- TOTALS pane */
function paneTotals(c){
  const today=todayISO();
  const weeks=[],months={};
  for(let w=0;w<8;w++){
    const end=addDays(today,-7*w), start=addDays(end,-6);
    const acts=DB.activities.filter(a=>a.date>=start&&a.date<=end);
    const sess=DB.sessions.filter(s=>s.done&&s.date>=start&&s.date<=end);
    let load=0,lower=0,expl=0;
    for(let i=0;i<7;i++){ const dd=dayDemand(addDays(start,i)); load+=dd.load; lower+=dd.lower; expl+=dd.expl; }
    weeks.push({start,end,acts:acts.length,sess:sess.length,min:sum(acts.map(a=>a.min))+sum(sess.map(s=>s.durationMin)),
      load:rnd(load,1),lower:rnd(lower,1),expl:rnd(expl,1)});
  }
  DB.activities.forEach(a=>{ const m=a.date.slice(0,7); months[m]=months[m]||{n:0,min:0,load:0,types:{}};
    months[m].n++; months[m].min+=a.min||0; months[m].load+=activityLoad(a);
    months[m].types[a.type]=(months[m].types[a.type]||0)+1; });
  const byType={};
  DB.activities.forEach(a=>{ byType[a.type]=byType[a.type]||{n:0,min:0,load:0}; byType[a.type].n++;
    byType[a.type].min+=a.min||0; byType[a.type].load+=activityLoad(a); });
  const maxLoad=Math.max(1,...weeks.map(w=>w.load));
  c.innerHTML=`
   <div class="card">
     <div class="card-h"><div class="card-t accent">Weekly load — last 8 weeks</div></div>
     <div class="chart-wrap">${barChart(weeks.slice().reverse().map((w,i)=>({v:w.load,t:i===7?'now':'',color:w.load>maxLoad*.85?'var(--orange)':'var(--accent)'})),{h:90})}</div>
     <div class="divider"></div>
     ${weeks.map((w,i)=>`<div class="kv"><span class="k">${i===0?'This week':i===1?'Last week':fmtDate(w.start)}</span>
       <span class="v">${w.sess+w.acts} sessions · ${w.min} min · load ${w.load}</span></div>`).join('')}
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Lower-body vs explosive demand</div></div>
     <div class="chart-wrap">${lineChart([
       {pts:weeks.slice().reverse().map(w=>({v:w.lower})),color:'var(--accent)',area:true},
       {pts:weeks.slice().reverse().map(w=>({v:w.expl})),color:'var(--orange)'}],{h:100,l:26})}</div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Lower body</span><span><i style="background:var(--orange)"></i>Explosive</span></div>
     <div class="hint" style="margin-top:9px">Watch for explosive demand climbing several weeks in a row without a dip — that is the pattern that precedes soft-tissue problems in racquet and field sports.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">By activity type — all time</div></div>
     ${Object.entries(byType).sort((a,b)=>b[1].load-a[1].load).map(([t,g])=>{
       const T=ACT_TYPES[t]||ACT_TYPES.other;
       return `<div class="kv"><span class="k">${esc(T.name)}</span>
         <span class="v">${g.n} × · ${fmtMin(g.min)} · load ${rnd(g.load,0)}</span></div>`;}).join('')
      ||'<div class="hint">No activities logged yet.</div>'}
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Monthly totals</div></div>
     ${Object.keys(months).sort().reverse().map(m=>`<div class="kv">
       <span class="k">${m}</span><span class="v">${months[m].n} activities · ${fmtMin(months[m].min)} · load ${rnd(months[m].load,0)}</span></div>`).join('')
      ||'<div class="hint">No activities logged yet.</div>'}
   </div>`;
}

/* Things the app has no activity type for, plus whatever this user has
   actually typed before. Fed to a native <datalist>, so the platform does the
   filtering as you type and the keyboard behaves the way the phone's does. */
const OTHER_SUGGESTIONS=[
  'Badminton','Table tennis','Cricket','Baseball','Rugby','Hockey','Handball',
  'Boxing','Kickboxing','Wrestling','Judo','Surfing','Kayaking','Canoeing',
  'Paddleboarding','Sailing','Horse riding','Skateboarding','Ice skating',
  'Dance','Ballet','Pilates','CrossFit','Circuit training','Spinning',
  'Cross-trainer','Stair climbing','Gardening','Manual work','Physiotherapy',
  'Stretching','Foam rolling','Sauna','Cold exposure','Walk with the dog'
];
function otherSuggestions(){
  const mine=[];
  (DB.activities||[]).forEach(a=>{
    const s=(a.subtype||'').trim();
    if(s && mine.indexOf(s)<0) mine.push(s);
  });
  /* the user's own words first: they are the likeliest next answer */
  return mine.concat(OTHER_SUGGESTIONS.filter(s=>mine.indexOf(s)<0));
}

function activitySheet(id,defDate){
  const ex = id? DB.activities.find(a=>a.id===id) : null;
  /* No pre-selected type: "what did you do" is the question, and answering it
     for the user is how you end up with a log full of tennis. */
  let type = ex? ex.type : null;
  let more = !!ex;           // editing opens with the details already visible
  const draw=()=>{
    const a = ex || {};
    const T = type? ACT_TYPES[type] : null;
    /* the types worth showing first: whatever this user actually does */
    const mine = mainSportActs().concat(['running','cycling','strength','walking'])
      .filter((x,i,arr)=>ACT_TYPES[x] && arr.indexOf(x)===i);
    const rest = Object.keys(ACT_TYPES).filter(k=>mine.indexOf(k)<0);
    const order = mine.concat(rest);

    openSheet(ex?'Edit activity':'Log activity',`
     <div class="field"><label>What did you do?</label>
       <div class="pills" id="asType">
         ${order.map(k=>`<button data-v="${k}" class="${k===type?'on':''}">${esc(ACT_TYPES[k].name)}</button>`).join('')}
       </div></div>

     ${type?`
     <div class="field"><label>How long?</label>
       <div class="pills" id="asQmin">${[20,30,45,60,90,120].map(m=>
         `<button type="button" data-v="${m}" class="${(a.min||0)===m?'on':''}">${m} min</button>`).join('')}</div>
       <input class="inp num" type="number" inputmode="numeric" id="asMin"
              value="${a.min||''}" placeholder="or type the minutes"
              style="margin-top:8px">
     </div>

     ${type==='other'?`
     <div class="field"><label>What was it?</label>
       <input class="inp" id="asName" list="asNames" autocomplete="off"
              value="${esc(a.subtype||'')}" placeholder="Start typing…">
       <datalist id="asNames">${otherSuggestions().map(s=>
         `<option value="${esc(s)}"></option>`).join('')}</datalist>
       <div class="hint">Suggestions appear as you type. Anything is fine.</div>
     </div>`:''}

     <div class="field"><label>How hard?</label>
       <div class="pills" id="asInt">
         ${['Easy','Moderate','Hard','Maximal'].map(f=>
           `<button data-v="${f}" class="${a.intensity===f?'on':''}">${f}</button>`).join('')}</div>
     </div>

     <button class="tert" id="asMoreT" aria-expanded="${more?'true':'false'}">
       ${more?'Fewer details':'Add details'} ${svg('down')}</button>

     <div id="asMore" ${more?'':'hidden'}>
       <div class="grid2">
         <div class="field"><label>Date</label>
           <input class="inp" type="date" id="asDate" value="${esc(a.date||defDate||todayISO())}"></div>
         <div class="field"><label>Start time</label>
           <input class="inp" type="time" id="asTime" value="${esc(a.time||'')}"></div>
       </div>
       ${T&&T.dist?`<div class="grid2">
         <div class="field"><label>Distance (km)</label>
           <input class="inp num" type="number" inputmode="decimal" step="0.1" id="asDist"
                  value="${a.dist||''}" placeholder="—"></div>
         <div class="field"><label>Pace (min/km)</label>
           <input class="inp" id="asPace" value="${esc(a.pace||'')}" placeholder="auto"></div>
       </div>`:''}
       ${type==='other'?'':['tennis','padel','squash'].includes(type)?`
         <div class="field"><label>Format</label><div class="pills" id="asFormat">
           ${['Singles','Doubles','Hitting','Solo drills'].map(f=>
             `<button data-v="${f}" class="${a.format===f?'on':''}">${f}</button>`).join('')}</div></div>
         <div class="field"><label>Session</label><div class="pills" id="asSubtype">
           ${['Match','Practice','Drills','Serve practice','Social'].map(f=>
             `<button data-v="${f}" class="${a.subtype===f?'on':''}">${f}</button>`).join('')}</div></div>`
       :`<div class="field"><label>Description</label>
          <input class="inp" id="asSubtype2" value="${esc(a.subtype||'')}"
                 placeholder="${type==='other'?'What was it?':'e.g. intervals, easy, match'}"></div>`}
       <div class="field"><label>Was this planned?</label>
         <div class="seg acc" id="asPlan">
           <button data-v="1" class="${a.planned===true?'on':''}">Planned</button>
           <button data-v="0" class="${a.planned===false?'on':''}">Unplanned</button>
         </div></div>
       ${sliderHTML('asRpe','Perceived effort',a.rpe||6,'Very easy','Maximal')}
       <div class="field"><label>Notes</label>
         <textarea class="inp" id="asNotes" placeholder="Anything worth remembering">${esc(a.notes||'')}</textarea></div>
       ${ex?`<button class="btn danger block" id="asDel">${svg('trash')} Delete activity</button>`:''}
     </div>`
     :`<div class="hint" style="margin-top:4px">Pick one to carry on.</div>`}
    `, type?`<button class="btn primary big block" id="asSave">${ex?'Save changes':'Save activity'}</button>`:'');

    /* one pill group behaves like every other pill group */
    const pills=(sel,cb)=>$$(sel+' button').forEach(b=>b.onclick=()=>{
      $$(sel+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); haptic(); if(cb)cb(b); });
    pills('#asFormat'); pills('#asSubtype'); pills('#asInt'); pills('#asPlan');
    pills('#asQmin', b=>{ const m=$('#asMin'); if(m) m.value=b.dataset.v; });
    /* typing a duration clears the pill, so the two never disagree */
    const mi=$('#asMin');
    if(mi) mi.addEventListener('input',()=>{
      $$('#asQmin button').forEach(x=>
        x.classList.toggle('on', x.dataset.v===String(+mi.value)));
    });
    $$('#asType button').forEach(b=>b.onclick=()=>{ type=b.dataset.v; draw(); });

    const mt=$('#asMoreT'), mb=$('#asMore');
    if(mt&&mb) mt.onclick=()=>{ more=!more; draw(); };

    if($('#asDel')) $('#asDel').onclick=()=>confirmSheet('Delete activity?',
      'It will be removed from your history and from all load calculations.','Delete',()=>{
        DB.activities=DB.activities.filter(x=>x.id!==id); save(true); toast('Deleted'); render(); },true);

    const sv=$('#asSave');
    if(sv) sv.onclick=()=>{
      const min=+($('#asMin')||{}).value||0;
      if(!min){ toast('How long was it?','err'); return; }
      const gv=sel=>{ const b=$(sel+' button.on'); return b?b.dataset.v:null; };
      let dist=$('#asDist')?(+$('#asDist').value||null):null;
      let pace=$('#asPace')?$('#asPace').value.trim():null;
      if(dist&&!pace&&min){ const p=min/dist; pace=Math.floor(p)+':'+String(Math.round((p%1)*60)).padStart(2,'0'); }
      const planned=gv('#asPlan');
      const rec={
        id: ex? ex.id : 'a'+uid(),
        date: ($('#asDate')||{}).value||defDate||todayISO(),
        time: ($('#asTime')||{}).value||null,
        type, min, dist, pace,
        format: gv('#asFormat'),
        subtype: gv('#asSubtype')
                 || ($('#asName')?$('#asName').value.trim():'')
                 || ($('#asSubtype2')?$('#asSubtype2').value.trim():null),
        /* unset stays unset: the app records what it was told, and
           activityLoad() supplies its own neutral rpe when none was given */
        intensity: gv('#asInt'),
        rpe: $('#asRpe')? +$('#asRpe').value : null,
        planned: planned==null? null : planned==='1',
        notes: ($('#asNotes')||{}).value.trim()||'',
        at: new Date().toISOString()
      };
      if(ex){ Object.assign(ex,rec); } else { DB.activities.push(rec); }
      DB.activities.sort((a,b)=>a.date<b.date?-1:1);
      save(true); closeSheet(); toast(ex?'Activity updated':'Activity logged','ok');
      setTimeout(render,220);
    };
  };
  draw();
}

/* "How did my week go" - the numbers and the narrative together, which is
   what that question actually wants. weekNumbers used to open the Strength
   pane, where it answered a question nobody had asked there. */
function paneWeek(c){
  const R=weekReview();
  c.innerHTML=weekNumbers(R)+weekNarrative(R);
}

/* ------------------------------------------------------------- WEEK */
function weekReview(){

  const today=todayISO(), start=addDays(today,-dowOf(today)), prevStart=addDays(start,-7);
  const range=(s,e)=>{ const o=[]; let d=s; while(d<=e){o.push(d);d=addDays(d,1);} return o; };
  const wk=range(start,today), pv=range(prevStart,addDays(start,-1));
  const stat=(days)=>{
    const cy=days.map(cycleByDate).filter(Boolean);
    const ci=days.map(d=>DB.checkins[d]).filter(Boolean);
    const ss=DB.sessions.filter(s=>s.done&&days.includes(s.date));
    const ac=DB.activities.filter(a=>days.includes(a.date));
    let load=0,lower=0,expl=0; days.forEach(d=>{const dd=dayDemand(d);load+=dd.load;lower+=dd.lower;expl+=dd.expl;});
    return {
      rec:mean(cy.map(x=>x.recovery)), hrv:mean(cy.map(x=>x.hrv)), rhr:mean(cy.map(x=>x.rhr)),
      sleep:mean(cy.map(x=>x.sleepMin)), strain:mean(cy.map(x=>x.strain)), debt:mean(cy.map(x=>x.sleepDebt)),
      sessions:ss.length, acts:ac.length, sport:ac.filter(a=>isMainSportAct(a.type)).length,
      min:sum(ss.map(s=>s.durationMin))+sum(ac.map(a=>a.min)),
      vol:sum(ss.map(s=>s.volume)), sets:sum(ss.map(s=>s.setsDone)),
      load:rnd(load,1), lower:rnd(lower,1), expl:rnd(expl,1),
      sore:mean(ci.map(x=>x.soreness)), energy:mean(ci.map(x=>x.energy)),
      days, nCy:cy.length
    };
  };
  const A=stat(wk), P=stat(pv);
  const dl=(a,b,dp)=>{ if(a==null||b==null)return ''; const d=a-b;
    return `<span class="${d>0?'up':d<0?'down':'flat'}">${d>0?'▲':d<0?'▼':'–'} ${Math.abs(rnd(d,dp||0))}</span>`; };

  // target attainment across the whole week, plus genuinely blank days
  const T=DB.targets, WP=weekProgress(today), TK=targetKeys();
  const tgtTotal=TK.reduce((s,k)=>s+(T[k]||0),0);
  const tgtDone =TK.reduce((s,k)=>s+Math.min(T[k]||0,WP[k]||0),0);
  /* the strength target this user actually set, not a fixed number */
  const strTgt=(T.lower||0)+(T.upper||0)+(T.power||0);
  const sleepNeed=DB.baselines.sleepNeed||480;
  const genericSleep=!!DB.baselines.sleepNeedGeneric;
  const compl=A.sessions;
  const missed=wk.filter(d=>d<today&&!DB.sessions.some(s=>s.date===d&&s.done)&&!DB.activities.some(a=>a.date===d));

  // narrative
  const good=[],attn=[];
  if(strTgt&&A.sessions>=strTgt) good.push(`${A.sessions} session${A.sessions===1?'':'s'} completed — at or above the ${strTgt}/week your targets ask for.`);
  else if(!strTgt&&A.sessions>=3) good.push(`${A.sessions} sessions completed this week.`);
  if(A.rec!=null&&P.rec!=null&&A.rec>P.rec+3) good.push(`Average recovery is up ${rnd(A.rec-P.rec,1)} points on last week.`);
  if(A.sleep!=null&&A.sleep>=sleepNeed-60) good.push(`Sleep averaged ${fmtMin(A.sleep)} — within an hour of your ${genericSleep?'assumed':'measured'} ${fmtMin(sleepNeed)} need.`);
  if(A.hrv!=null&&P.hrv!=null&&A.hrv>P.hrv+2) good.push(`HRV averaged ${rnd(A.hrv,0)} ms, up ${rnd(A.hrv-P.hrv,1)} on last week.`);
  if(A.acts>0) good.push(`${A.acts} activit${A.acts===1?'y':'ies'} logged, so the engine had real data to adapt from rather than assumptions.`);
  if(A.sleep!=null&&A.sleep<sleepNeed-60) attn.push(`Sleep averaged ${fmtMin(A.sleep)} against a ${fmtMin(sleepNeed)} need${genericSleep?' (a general adult estimate — import WHOOP data and this becomes yours)':''} — more than an hour short.`);
  if(missed.length>=2) attn.push(`${missed.length} day${missed.length>1?'s':''} with nothing logged at all (${missed.map(fmtDate).join(', ')}). Rest days are fine — unlogged days just leave the engine guessing.`);
  if(strTgt&&A.sessions<strTgt-1) attn.push(`${A.sessions} session${A.sessions===1?'':'s'} against a ${strTgt}/week target. If recovery was the reason that is the system working; if it was not, the gap is worth closing.`);
  if(A.expl>=20) attn.push(`Explosive demand totalled ${A.expl} this week — high. Watch for accumulating soreness in the calves and hamstrings.`);
  if(A.sore!=null&&A.sore>=6) attn.push(`Average soreness ${rnd(A.sore,1)}/10 — elevated. Consider an extra easy day before the next power session.`);
  if(A.rhr!=null&&DB.baselines.rhr&&A.rhr>DB.baselines.rhr+2) attn.push(`Resting HR averaged ${rnd(A.rhr,1)} vs your ${rnd(DB.baselines.rhr,1)} baseline.`);

  const next=[];
  if(A.sleep!=null&&A.sleep<sleepNeed-60) next.push('Anchor your wake time to within 30 minutes every day. Wake-time regularity is the cheapest recovery lever you have, and once you have a few weeks of data here you will be able to see it in your own numbers.');
  if(strTgt&&A.sessions<strTgt) next.push(`Aim for ${strTgt} session${strTgt===1?'':'s'} next week — that is what your goals, days and equipment came out at.`);
  if(A.expl>=20) next.push('Cut one plyometric block next week and keep the jump quality high rather than the volume.');
  if(!next.length) next.push('Hold this pattern. It is working — repeat it before adding anything.');

  return {A, P, dl, wk, pv, good, attn, next,
          tgtDone, tgtTotal, compl, missed, strTgt, sleepNeed, genericSleep};
}

/* the narrative half, rendered wherever it is useful */
function weekNarrative(R){
  return `
  <div class="card"><div class="card-t accent" style="margin-bottom:10px">What went well</div>
    ${R.good.length?`<ul class="why" style="border:none;padding:0;margin:0">${R.good.map(g=>`<li class="pos"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul>`
      :'<div class="hint">Not enough logged this week to say. Log your sessions and activities and this fills in.</div>'}</div>

  <div class="card"><div class="card-t" style="margin-bottom:10px;color:var(--orange)">What needs attention</div>
    ${R.attn.length?`<ul class="why" style="border:none;padding:0;margin:0">${R.attn.map(g=>`<li class="warn"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul>`
      :'<div class="hint">Nothing flagged. Good week.</div>'}</div>

  <div class="card"><div class="card-t" style="margin-bottom:10px;color:var(--cyan)">Next week</div>
    <ul class="why" style="border:none;padding:0;margin:0">${R.next.map(g=>`<li class="info"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul></div>

  <div class="note">Drawn only from what you logged. A thin week means observations, not conclusions.</div>`;
}

/* the week's numbers, shown above the training history they summarise */
function weekNumbers(R){
  const A=R.A, P=R.P, dl=R.dl, wk=R.wk;
  return `
  <div class="stats c2">
    ${statTile('Avg recovery',A.rec!=null?rnd(A.rec,0):null,'%',A.rec>=67?'g':A.rec>=34?'y':'r',dl(A.rec,P.rec))}
    ${statTile('Avg HRV',A.hrv!=null?rnd(A.hrv,0):null,'ms','c',dl(A.hrv,P.hrv))}
    ${statTile('Avg RHR',A.rhr!=null?rnd(A.rhr,1):null,'bpm','',dl(A.rhr,P.rhr,1))}
    ${statTile('Avg sleep',A.sleep!=null?fmtMin(A.sleep):null,'',A.sleep>=R.sleepNeed-60?'g':'o',dl(A.sleep,P.sleep))}
  </div>
  <div class="stats" style="margin-top:9px">
    ${statTile('Sessions',A.sessions,'','a',`vs ${P.sessions}`)}
    ${statTile('Activities',A.acts,'','g',`${A.sport} ${esc(sportLC())}`)}
    ${statTile('Week load',A.load,'','o',dl(A.load,P.load,1))}
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-h"><div class="card-t">Daily load</div></div>
    <div class="chart-wrap">${barChart(wk.map(d=>{const dd=dayDemand(d);
      return {v:dd.load,t:DOW_NAME[dowOf(d)][0],color:dd.load>=12?'var(--orange)':dd.load>=7?'var(--accent)':'var(--surface-3)'};}),{h:84})}</div>
    <div class="hint" style="margin-top:6px">Hard/easy alternation is the goal.</div>
  </div>`;
}

/* --------------------------------------------------------- STRENGTH */
function paneStrength(c){
  const done=DB.sessions.filter(s=>s.done);
  /* the week's numbers live in Progress > This week; this pane is about
     whether individual lifts are moving */
  if(done.length<1){
    c.innerHTML='<div class="empty"><h4>No sessions yet</h4><p>Complete a workout and your exercise-by-exercise progression appears here.</p></div>';
    return; }
  const byEx={};
  done.forEach(s=>s.entries.forEach(en=>{
    const sets=en.sets.filter(x=>x.done&&x.reps);
    if(!sets.length)return;
    byEx[en.exerciseId]=byEx[en.exerciseId]||{name:en.name,pts:[]};
    const tot=sum(sets.map(x=>+x.reps||0));
    const best=Math.max(...sets.map(x=>+x.reps||0));
    const vol=sum(sets.map(x=>(+x.reps||0)*(+x.weight||1)));
    byEx[en.exerciseId].pts.push({date:s.date,sets:sets.length,totReps:tot,best,vol,
      rpe:mean(sets.map(x=>+x.rpe||null))});
  }));
  const keys=Object.keys(byEx).sort((a,b)=>byEx[b].pts.length-byEx[a].pts.length);
  c.innerHTML=`
   <div class="card">
     <div class="card-h"><div class="card-t accent">Total weekly volume</div></div>
     <div class="chart-wrap">${(()=>{const w=[];for(let i=7;i>=0;i--){const e=addDays(todayISO(),-7*i),s=addDays(e,-6);
       w.push({v:sum(done.filter(x=>x.date>=s&&x.date<=e).map(x=>x.volume)),t:i===0?'now':''});} return barChart(w,{h:84});})()}</div>
     <div class="hint" style="margin-top:6px">Volume = reps × weight (bodyweight exercises count as 1 per rep). Useful as a trend, not an absolute.</div>
   </div>
   ${keys.map(k=>{
     const e=byEx[k], pts=e.pts.slice(-12);
     const first=pts[0], last=pts[pts.length-1];
     const chg=pts.length>1? last.totReps-first.totReps : null;
     return `<div class="card">
       <div class="card-h"><div class="card-t">${esc(e.name)}</div>
         <span class="tag ${chg>0?'g':chg<0?'r':''}">${pts.length} SESSIONS</span></div>
       <div class="chart-wrap">${lineChart([{pts:pts.map(p=>({v:p.totReps})),color:'var(--accent)',area:true}],{h:76,l:24})}</div>
       <div class="divider"></div>
       <div class="kv"><span class="k">Latest</span><span class="v">${last.sets} sets · ${last.totReps} total reps${last.rpe?' · RPE '+rnd(last.rpe,1):''}</span></div>
       ${pts.length>1?`<div class="kv"><span class="k">Change since first logged</span>
         <span class="v ${chg>0?'up':chg<0?'down':'flat'}">${chg>0?'+':''}${chg} reps</span></div>`:''}
       <div class="kv"><span class="k">Best single set</span><span class="v">${Math.max(...pts.map(p=>p.best))} reps</span></div>
       <div class="note ${chg>0?'acc':chg<0?'warn':''}" style="margin-top:10px;font-size:11.5px">
         ${chg>0?'Progressing — keep adding reps until you reach the top of the range, then move to the harder variation.'
          :chg<0?'Output has fallen. Check recovery and sleep before assuming you need to train harder — dropping performance is usually a fatigue signal, not a motivation one.'
          :'Holding steady. If recovery is good, add a rep per set. If recovery is poor, maintaining is the correct outcome.'}</div>
     </div>`;}).join('')}`;
}

     const h=byT[T.id]||[];

       <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">

           <div style="font-size:10px;color:var(--text-3);font-weight:700">${esc(T.unit)}</div></div>
       </div>
       ${h.length>1?`<div class="chart-wrap" style="margin-top:9px">${lineChart([{pts:h.map(x=>({v:x.value})),color:better?'var(--green)':'var(--orange)',area:true}],{h:60,l:24,dp:1})}</div>
         <div class="kv"><span class="k">Change from first test</span><span class="v ${better?'up':'down'}">${chg>0?'+':''}${rnd(chg,1)} ${esc(T.unit)}</span></div>`:''}
       ${h.length?`<div class="hint" style="margin-top:6px">${h.length} result${h.length>1?'s':''} · last ${fmtDate(last.date)}</div>`:''}

      <div class="field"><label>Date</label><input class="inp" type="date" id="tDate" value="${todayISO()}"></div>
      <div class="field"><label>Result</label><input class="inp num" type="number" inputmode="decimal" step="0.1" id="tVal" placeholder="value"></div>
      <div class="field"><label>Notes</label><input class="inp" id="tNote" placeholder="conditions, which side, how you felt"></div>
      <div class="note" id="tHow"></div>
    `,`<button class="btn primary big block" id="tSave">Save result</button>`);
    const upd=()=>{ const T=TESTS.find(x=>x.id===$('#tSel').value); $('#tHow').innerHTML='<b>How to test:</b> '+esc(T.how); };
    $('#tSel').onchange=upd; upd();
    $('#tSave').onclick=()=>{
      const v=parseFloat($('#tVal').value); if(isNaN(v)){toast('Enter a value','err');return;}
      DB.tests.push({id:'t'+uid(),testId:$('#tSel').value,date:$('#tDate').value,value:v,notes:$('#tNote').value.trim()});
      save(true); closeSheet(); toast('Result saved','ok'); setTimeout(()=>render(),240);
    };

/* --------------------------------------------------------- PHYSIQUE */
function panePhysique(c){
  const P=DB.physique.slice().sort((a,b)=>a.date<b.date?-1:1);
  const F=[['weight','Weight','kg'],['waist','Waist','cm'],['chest','Chest','cm'],
           ['shoulders','Shoulders','cm'],['arm','Arm (flexed)','cm'],['thigh','Thigh','cm']];
  c.innerHTML=`
   <div class="note warn" style="margin-bottom:14px">WHOOP cannot measure body composition. Physique progress is tracked here from measurements and photos you record yourself — kept completely separate from the performance metrics so neither one distorts the other.</div>
   <button class="btn primary block" id="phAdd" style="margin-bottom:14px">${svg('plus')} Add measurements</button>
   ${P.length? F.map(([k,l,u])=>{
     const pts=P.filter(p=>p[k]!=null);
     if(pts.length<1) return '';
     const last=pts[pts.length-1], first=pts[0];
     const chg=pts.length>1?last[k]-first[k]:null;
     return `<div class="card tight">
       <div style="display:flex;justify-content:space-between;align-items:center">
         <div><div style="font-size:14px;font-weight:750">${l}</div>
         <div style="font-size:11px;color:var(--text-3)">${pts.length} entries</div></div>
         <div style="text-align:right"><span class="num" style="font-size:20px;font-weight:850;letter-spacing:-.5px">${last[k]}</span>
         <span style="font-size:11px;color:var(--text-3);font-weight:700"> ${u}</span>
         ${chg!=null?`<div style="font-size:11px;font-weight:700" class="${chg>0?'up':'down'}">${chg>0?'+':''}${rnd(chg,1)} ${u}</div>`:''}</div>
       </div>
       ${pts.length>1?`<div class="chart-wrap" style="margin-top:8px">${lineChart([{pts:pts.map(p=>({v:p[k]})),color:'var(--violet)',area:true}],{h:56,l:26,dp:1})}</div>`:''}
     </div>`;}).join('')
    :'<div class="empty"><div class="ei">'+svg('ruler')+'</div><h4>No measurements yet</h4><p>Record a baseline now and repeat every 4 weeks, same time of day, same conditions.</p></div>'}
   <div class="card">
     <div class="card-t" style="margin-bottom:10px">What drives the physique goal</div>
     <div class="kv"><span class="k">Shoulder width / V-taper</span><span class="v">Lateral Raise · Pike Push-Up · Band Lat Pulldown</span></div>
     <div class="kv"><span class="k">Upper back</span><span class="v">Band Row · DB Row · Face Pull</span></div>
     <div class="kv"><span class="k">Chest definition</span><span class="v">Push-Up progressions · Floor Press</span></div>
     <div class="kv"><span class="k">Arms</span><span class="v">Curls + Triceps at high reps to failure</span></div>
     <div class="kv"><span class="k">Posture</span><span class="v">Pull-Apart · Prone Y-T-W · Wall Slides</span></div>
     ${(DB.profile.gear||[]).indexOf('bb')<0
       ? `<div class="note acc" style="margin-top:11px">With light dumbbells, visible change comes from <b>proximity to failure, slow eccentrics and total weekly sets</b> — not from load. That is why the upper-body sessions prescribe 15–25 reps at RPE 8–9 rather than heavy triples.</div>`
       : `<div class="note acc" style="margin-top:11px">With a barbell available, progressive load is your main driver — add weight before adding reps, and keep the last set 1–2 reps short of failure.</div>`}
   </div>`;
  $('#phAdd').onclick=()=>{
    openSheet('Add measurements',`
      <div class="field"><label>Date</label><input class="inp" type="date" id="phDate" value="${todayISO()}"></div>
      <div class="grid2">
        ${F.map(([k,l,u])=>`<div class="field"><label>${l} (${u})</label>
          <input class="inp num phF" data-k="${k}" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>`).join('')}
      </div>
      <div class="field"><label>Notes</label><textarea class="inp" id="phNote" placeholder="Conditions, time of day, how you look/feel"></textarea></div>
      <div class="hint">Measure at the same time of day, ideally in the morning before eating, with the same tape tension each time.</div>
    `,`<button class="btn primary big block" id="phSave">Save</button>`);
    $('#phSave').onclick=()=>{
      const rec={id:'p'+uid(),date:$('#phDate').value,notes:$('#phNote').value.trim()};
      let any=false;
      $$('.phF').forEach(i=>{ if(i.value!==''){ rec[i.dataset.k]=parseFloat(i.value); any=true; } });
      if(!any){ toast('Enter at least one measurement','err'); return; }
      DB.physique.push(rec); save(true); closeSheet(); toast('Saved','ok'); setTimeout(()=>render(),240);
    };
  };
}

/* ------------------------------------------------------------ LINKS */
/* Cycle observations belong with the other correlations, and carry the same
   warning: an association in your own data, never a cause. */
function mcLinksBlock(){
  if(!mcOn()) return '';
  const ev=mcEvidence();
  const rows=MC_PHASES.filter(k=>ev.phases[k].n>0);
  if(!rows.length) return '';
  const any=rows.some(k=>ev.phases[k].established);
  return `<div class="sec-t">Cycle context</div>
  <div class="card">
    ${rows.map(k=>{ const e=ev.phases[k];
      return `<div class="kv"><span class="k">${esc(k.charAt(0).toUpperCase()+k.slice(1))}
        <span style="color:var(--text-3);font-weight:600">· ${e.n} day${e.n===1?'':'s'}</span></span>
        <span class="v num" style="color:${e.established?(e.z<0?'var(--orange)':'var(--green)'):'var(--text-3)'}">${
          e.diff==null?'—':(e.diff>0?'+':'')+e.diff}</span></div>`;}).join('')}
    <div class="hint" style="margin-top:9px">${any
      ? 'You have tended to report a measurably different day around the highlighted phase. Baseline treats that as one small input, capped at 5 points of readiness.'
      : ev.blocked
        ? 'Nothing here influences a recommendation — '+esc(ev.blocked)+'.'
        : 'No single phase stands out clearly enough yet to influence a recommendation.'} A correlation in your own logs — not a cause, and not a medical finding.</div>
  </div>`;
}

function paneLinks(c){
  const cors=correlations();
  const rev=adviceReview();
  c.innerHTML=`
   <div class="card" style="margin-bottom:14px;border-left:3px solid var(--violet)">
     <div class="card-h"><div class="card-t accent">Is this engine's advice any good?</div>
       ${rev.n?`<span class="tag">${rev.n} DAY${rev.n===1?'':'S'}</span>`:''}</div>
     ${rev.n===0
       ? `<div class="hint">Nothing to judge yet. Each day's call is recorded before you act on it; once there are enough of both, this compares the mornings after.</div>`
       : `<div class="kv"><span class="k">You followed the recommendation</span><span class="v">${rev.adherence}% of ${rev.n} days</span></div>
          ${rev.ready
            ? `<div class="kv"><span class="k">Average ${esc(rev.label)} when you followed it</span><span class="v">${rnd(rev.keptAvg,1)}</span></div>
               <div class="kv"><span class="k">…and when you did not</span><span class="v">${rnd(rev.ignoredAvg,1)}</span></div>
               <div class="kv"><span class="k">Difference</span><span class="v" style="color:${rev.diff>1?'var(--green)':rev.diff<-1?'var(--red)':'var(--text-2)'}">${rev.diff>0?'+':''}${rev.diff}</span></div>
               <div class="note ${Math.abs(rev.diff)<=1?'':'acc'}" style="margin-top:11px">${
                 Math.abs(rev.diff)<=1
                   ? 'No meaningful difference so far. That is a real result: on your data this engine is not yet demonstrably better than your own judgement.'
                   : rev.diff>0
                     ? `Days you followed it were followed by <b>${rev.diff}</b> better ${esc(rev.label)} on average. Suggestive, not proof — you probably also felt better on the days you agreed with it.`
                     : `Days you followed it came out <b>${Math.abs(rev.diff)}</b> worse on average. Worth treating the recommendation more sceptically, and worth telling me so the weights can be looked at.`}</div>`
            : `<div class="hint" style="margin-top:8px">Not enough yet to compare: ${rev.nKept} day${rev.nKept===1?'':'s'} following it and ${rev.nIgnored} not, against a minimum of ${rev.min} each. Until both sides reach that, any difference would be noise and nothing is claimed.</div>`}
          ${rev.restReady?`<div class="note" style="margin-top:10px">When it specifically said <b>rest or mobility</b>: ${rnd(rev.restKeptAvg,1)} when you took it, ${rnd(rev.restIgnoredAvg,1)} when you trained anyway (${rev.restDiff>0?'+':''}${rev.restDiff}).</div>`:''}`}
   </div>
   <div class="note red" style="margin-bottom:14px"><b>Correlations, not causes.</b> Two things moving together does not mean one caused the other. Treat each line as a hypothesis, not a finding.</div>
   ${cors.length? cors.map(x=>{
     const a=Math.abs(x.r), cls=a<0.2?'':a<0.35?'c':a<0.5?'o':'a';
     return `<div class="card tight">
       <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
         <div style="flex:1"><div style="font-size:13.5px;font-weight:700">${esc(x.label)}</div>
           <div style="font-size:11px;color:var(--text-3);margin-top:3px">${rLabel(x.r)} ${x.r>0?'positive':'negative'} relationship · n=${x.n} days</div></div>
         <div style="text-align:right"><span class="num" style="font-size:18px;font-weight:850;color:var(--${a>=0.35?'accent':'text-2'})">${x.r>0?'+':''}${rnd(x.r,2)}</span></div>
       </div>
       <div class="bar ${cls}" style="margin-top:8px"><i style="width:${clamp(a*100,3,100)}%"></i></div>
     </div>`;}).join('')
    :`<div class="empty"><div class="ei">${svg('pulse')}</div><h4>Not enough data yet</h4><p>${usesDevice()
        ? `Import your ${esc(SRC_NAME())} history, or log a few weeks of daily numbers, and log 2–3 weeks of activity — then relationships appear here.`
        : 'These relationships are drawn between a wearable\'s overnight metrics and what you did the day before. Without a wearable there is nothing to correlate, so this stays empty rather than showing you something invented.'}</p></div>`}
   ${cors.length?`<div class="card">
     <div class="card-t" style="margin-bottom:9px">How to read these</div>
     <div class="kv"><span class="k">|r| below 0.2</span><span class="v">Negligible — ignore</span></div>
     <div class="kv"><span class="k">0.2 – 0.35</span><span class="v">Weak — possible, unproven</span></div>
     <div class="kv"><span class="k">0.35 – 0.5</span><span class="v">Moderate — worth testing</span></div>
     <div class="kv"><span class="k">Above 0.5</span><span class="v">Strong — still not causal</span></div>
     <div class="hint" style="margin-top:9px">Test enough relationships and some look meaningful by chance. A single strong one in a few months of data usually is.</div>
   </div>`:''}`;
}

/* =========================================================================
   INJURY SHEET
   Naming the area and an end date is the whole interaction. Everything else —
   which exercises disappear, which sessions get pushed down — follows from
   BODY_AREAS, so the user is never asked to translate a sore knee into
   movement patterns themselves.
   ====================================================================== */
function limitSheet(id){
  const P=DB.profile;
  if(!Array.isArray(P.limits)) P.limits=[];
  const ex=id?P.limits.find(l=>l.id===id):null;
  const d=ex||{id:'lim'+uid(),area:null,side:'',severity:'mod',
               until:addDays(todayISO(),14),note:''};
  const draw=()=>{
    const a=d.area?areaOf(d.area):null;
    const body=`
     <p class="hint" style="margin-bottom:14px">What is bothering you, and until when. Movements that load it are dropped; the rest stays. Not medical advice.</p>
     <div class="field"><label>Where</label>
       
       ${BODY_AREAS.map(x=>`<button class="card tight limArea ${d.area===x.id?'on':''}" data-v="${x.id}"
           style="display:block;width:100%;text-align:left;margin-bottom:7px">
           <div style="font-weight:750;font-size:14.5px">${esc(x.name)}</div>
           <div style="font-size:11.5px;color:var(--text-3);margin-top:3px">${esc(x.hint)} would be avoided</div>
         </button>`).join('')}
     </div>
     ${a?`
     <div class="field"><label>Side</label>
       <div class="pills" id="limSide">${['','Left','Right','Both'].map(s=>
         `<button data-v="${s}" class="${(d.side||'')===s?'on':''}">${s||'Not specific'}</button>`).join('')}</div></div>
     <div class="field"><label>How limiting is it?</label>
       <div class="pills" id="limSev">
         <button data-v="mod" class="${d.severity!=='high'?'on':''}">Managing it</button>
         <button data-v="high" class="${d.severity==='high'?'on':''}">Significant</button>
       </div>
       <div class="hint">Managing it caps the risky movements. Significant blocks them.</div></div>
     <div class="field"><label>Until</label>
       <input class="inp" type="date" id="limUntil" value="${esc(d.until||'')}">
       <div class="hint">Expires on its own. Mark it better early if it clears up.</div></div>
     <div class="field"><label>Note (optional)</label>
       <input class="inp" id="limNote" value="${esc(d.note||'')}" placeholder="e.g. physio said avoid deep flexion"></div>
     <div class="note warn">While this is active: <b>${esc((a.avoid||[]).map(p=>PATTERNS[p]||p).join(', '))}</b> is dropped${
        (a.caution||[]).length?`, and <b>${esc(a.caution.map(p=>PATTERNS[p]||p).join(', '))}</b> ${d.severity==='high'?'is dropped too':'is kept but capped'}`:''}.</div>
     `:''}`;
    const foot=`<div class="btn-row">
      ${ex?`<button class="btn ghost" id="limDel">Remove</button>`:''}
      <button class="btn primary" id="limSave" style="flex:2">${ex?'Save':'Add limitation'}</button></div>`;
    if($('#sheet').classList.contains('on')) updateSheet(ex?'Edit limitation':'Add a limitation', body, foot);
    else openSheet(ex?'Edit limitation':'Add a limitation', body, foot);

    $$('.limArea').forEach(b=>b.onclick=()=>{ d.area=b.dataset.v; haptic(); draw(); });
    const pill=(sel,k)=>{ const el=$(sel); if(!el)return;
      $$(sel+' button').forEach(b=>b.onclick=()=>{ d[k]=b.dataset.v; haptic(); draw(); }); };
    pill('#limSide','side'); pill('#limSev','severity');
    const del=$('#limDel');
    if(del) del.onclick=()=>{ DB.profile.limits=P.limits.filter(l=>l.id!==d.id);
      save(true); closeSheet(); toast('Limitation removed'); setTimeout(render,240); };
    $('#limSave').onclick=()=>{
      if(!d.area){ toast('Pick an area first','err'); return; }
      const u=$('#limUntil'); if(u) d.until=u.value||null;
      const n=$('#limNote'); if(n) d.note=n.value.trim();
      if(!ex) P.limits.push(d);
      save(true); closeSheet(); toast('Saved — sessions will route around it','ok');
      setTimeout(render,240);
    };
  };
  draw();
}

/* =========================================================================
   VIEW: METRICS  (import · baselines · trends · sleep)

let HTAB='trends';
function viewWhoop(v){
  const n=DB.whoop.cycles.length;
  /* generic heading; the device's name belongs in the subtitle, where it is
     context rather than a label that changes shape per user */
  appbar('Metrics',
    n ? `${esc(usesDevice()?SRC_NAME():'Manual')} · ${n} days · ${DB.whoop.cycles[0].date} → ${DB.whoop.cycles[n-1].date}`
      : (usesDevice() ? `${esc(SRC_NAME())} · nothing imported yet`
                      : 'No wearable — running from your check-ins'));
  /* Nothing to chart and no device to chart it from. The panes used to carry
     this message via needImport(); with the sub-tabs gone the index has to
     carry it, or someone with no wearable gets four rows leading to four
     empty screens. */
  if(!usesDevice() && !DB.whoop.cycles.length){
    v.innerHTML=`<div class="empty"><h4>No wearable connected</h4>
      <p>These pages chart a device's overnight metrics. Baseline runs from your
         daily check-in and training log instead, and does not need one.</p>
      <button class="btn primary" id="mAdd" style="margin-top:16px">Add a wearable</button></div>
      <div class="rows" id="hRows" hidden></div>`;
    $('#mAdd').onclick=()=>startSetup(true);
    bindInputs(v);
    return;
  }
  /* HTAB survives so the places that deep-link here ("Import your data")
     still land on the right pane; it simply picks a page now instead of a tab. */
  const rows=[
    {t:'Trends', icon:'chart', s: n? `${n} days of history` : 'Nothing imported yet',
     go:()=>openPane('Trends', null, paneTrends)},
    {t:'Sleep', icon:'moon', s: n? 'Duration against your need' : 'Nothing imported yet',
     go:()=>openPane('Sleep', null, paneSleep)},
    {t:'Baselines', icon:'target',
     s: DB.baselines.computed? 'Your own normal, not a population average' : 'Not established yet',
     go:()=>openPane('Baselines', null, paneBaselines)},
    {t:'Import', icon:'ul', s: usesDevice()? `Add a ${esc(SRC_NAME())} export` : 'Add a wearable export',
     go:()=>openPane('Import', null, paneImport)}
  ];
  v.innerHTML=navRows('hRows',rows);
  wireRows('hRows',rows);
  /* a deep link opens its pane straight away rather than the index */
  if(HTAB){
    const want={trends:0,sleep:1,baselines:2,import:3}[HTAB];
    if(want!=null && HTAB!=='trends'){ HTAB=null; rows[want].go(); return; }
    HTAB=null;
  }
  bindInputs(v);
}
function needImport(c){
  c.innerHTML=usesDevice()
    ? `<div class="empty"><div class="ei">${svg('chart')}</div><h4>No ${esc(SRC_NAME())} data yet</h4>
       <p>Import an export from ${esc(SRC_NAME())} to unlock trends, baselines and correlations — or type this morning's numbers into the daily check-in.</p>
       <button class="btn primary" id="niGo" style="margin-top:16px">Go to import</button></div>`
    : `<div class="empty"><div class="ei">${svg('edit')}</div><h4>No wearable connected</h4>
       <p>Trends here are built from a device's overnight metrics. You told setup you do not use one, so there is nothing to chart — the daily engine runs from your check-ins and training log instead.</p>
       <button class="btn primary" id="niGo" style="margin-top:16px">Add a wearable</button></div>`;
  $('#niGo').onclick=()=>{ if(usesDevice()){ HTAB='import'; render(); } else startSetup(true); };
}
function paneTrends(c){
  const C=DB.whoop.cycles; if(!C.length) return needImport(c);
  const N=Math.min(60,C.length), R=C.slice(-N);
  const B=DB.baselines;
  const last7=C.slice(-7), prev7=C.slice(-14,-7);
  const d=(k,dp)=>{ const a=mean(last7.map(x=>x[k])), b=mean(prev7.map(x=>x[k]));
    if(a==null||b==null)return ''; const v=a-b; return `${v>0?'▲':v<0?'▼':'–'} ${Math.abs(rnd(v,dp||0))} vs prev 7d`; };
  c.innerHTML=`
   <div class="stats">
     ${statTile('Recovery',rnd(mean(last7.map(x=>x.recovery)),0),'%','a',d('recovery'))}
     ${statTile('HRV',rnd(mean(last7.map(x=>x.hrv)),0),'ms','c',d('hrv'))}
     ${statTile('RHR',rnd(mean(last7.map(x=>x.rhr)),1),'bpm','',d('rhr',1))}
   </div>
   <div class="card" style="margin-top:12px">
     <div class="card-h"><div class="card-t accent">Recovery — last ${N} days</div></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.recovery})),color:'var(--accent)',area:true}],{h:104,min:0,max:100,baseline:B.recovery})}</div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Daily recovery</span><span><i style="background:var(--text-3)"></i>Your ${dv(B.recovery,0)}% average</span></div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">HRV vs baseline</div><span class="tag c">${dv(B.hrv,0)} MS ± ${dv(B.hrvSd,0)}</span></div>
     <div class="chart-wrap">${lineChart([
       {pts:R.map(x=>({v:x.hrv})),color:'var(--cyan)',area:true},
       {pts:R.map((x,i)=>({v:mean(R.slice(Math.max(0,i-6),i+1).map(y=>y.hrv))})),color:'var(--violet)',dots:false,w:1.6,dash:true}
     ],{h:104,baseline:B.hrv})}</div>
     <div class="legend"><span><i style="background:var(--cyan)"></i>Daily HRV</span><span><i style="background:var(--violet)"></i>7-day average</span><span><i style="background:var(--text-3)"></i>Baseline</span></div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Resting heart rate</div><span class="tag">${dv(B.rhr,1)} BPM ± ${dv(B.rhrSd,1)}</span></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.rhr})),color:'var(--orange)',area:true}],{h:92,baseline:B.rhr,dp:0})}</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Respiratory rate</div><span class="tag">${dv(B.respRate,1)} RPM ± ${dv(B.respSd,2)}</span></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.resp})),color:'var(--violet)',area:true}],{h:84,dp:1,baseline:B.respRate})}</div>
     <div class="hint" style="margin-top:6px">Normally very stable. A sustained jump is a health signal, not a training one.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Day strain</div></div>
     <div class="chart-wrap">${barChart(C.slice(-28).map(x=>({v:x.strain,color:x.strain>=14?'var(--orange)':x.strain>=10?'var(--accent)':'var(--surface-3)'})),{h:84,max:21})}</div>
     <div class="hint" style="margin-top:6px">Orange bars are strain ${DB.settings.hardStrain}+, the level you have set as a hard day.${(()=>{
       const pairs=[]; C.forEach((x,i)=>{ const n=C[i+1];
         if(n&&x.strain!=null&&n.recovery!=null) pairs.push({hard:x.strain>=DB.settings.hardStrain,r:n.recovery}); });
       const h=pairs.filter(x=>x.hard).map(x=>x.r), l=pairs.filter(x=>!x.hard).map(x=>x.r);
       if(h.length<5||l.length<5) return ' Once you have a few weeks of data here, this will say what they actually cost you.';
       return ` In your own data they are followed by <b>${rnd(mean(h),1)}%</b> recovery against <b>${rnd(mean(l),1)}%</b> after easier days.`;})()}</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Recovery band mix — last 30 days</div></div>
     ${(()=>{const l=C.slice(-30).filter(x=>x.recovery!=null);
       const g=l.filter(x=>x.recovery>=67).length,y=l.filter(x=>x.recovery>=34&&x.recovery<67).length,r=l.filter(x=>x.recovery<34).length;
       const t=l.length||1;
       return `<div style="display:flex;height:11px;border-radius:99px;overflow:hidden;margin-bottom:11px">
         <div style="width:${g/t*100}%;background:var(--green)"></div>
         <div style="width:${y/t*100}%;background:var(--yellow)"></div>
         <div style="width:${r/t*100}%;background:var(--red)"></div></div>
         <div class="kv"><span class="k" style="color:var(--green)">Green (67+)</span><span class="v">${g} days · ${Math.round(g/t*100)}%</span></div>
         <div class="kv"><span class="k" style="color:var(--yellow)">Yellow (34–66)</span><span class="v">${y} days · ${Math.round(y/t*100)}%</span></div>
         <div class="kv"><span class="k" style="color:var(--red)">Red (under 34)</span><span class="v">${r} days · ${Math.round(r/t*100)}%</span></div>`;})()}
   </div>`;
}
function paneSleep(c){
  const C=DB.whoop.cycles.filter(x=>x.sleepMin!=null); if(!C.length) return needImport(c);
  const R=C.slice(-45), B=DB.baselines;

           <span class="num" style="font-weight:800;color:${rec>=67?'var(--green)':rec>=55?'var(--yellow)':'var(--orange)'}">${rec!=null?rnd(rec,1)+'%':'—'}</span></div>

function journalCard(){
  const J=DB.whoop.journal, qs={};
  J.forEach(j=>{ qs[j.q]=qs[j.q]||{n:0,y:0}; qs[j.q].n++; if(j.yes)qs[j.q].y++; });
  const rows=Object.entries(qs).map(([q,v])=>({q,n:v.n,pct:v.y/v.n*100}))
    .filter(r=>r.n>=10).sort((a,b)=>Math.abs(50-a.pct)-Math.abs(50-b.pct));
  const useful=rows.filter(r=>r.pct>3&&r.pct<97);
  return `<div class="card">
    <div class="card-h"><div class="card-t">Journal behaviours</div><span class="tag">${rows.length} QUESTIONS</span></div>

}

$('#fileIn').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]); if(!files.length)return;
  toast('Reading '+files.length+' file'+(files.length>1?'s':'')+'…');
  const results=[];
  for(const f of files){
    try{ const txt=await f.text(); results.push(importWhoopFile(f.name,txt)); }
    catch(err){ results.push({file:f.name,error:'Could not read file',added:0,dupes:0}); }
  }
  DB.whoop.imports.push({at:new Date().toISOString(),results});
  recomputeBaselines(); saveWhoop();
  e.target.value='';
  const ok=results.filter(r=>!r.error), bad=results.filter(r=>r.error);
  const added=sum(ok.map(r=>r.added)), dup=sum(ok.map(r=>r.dupes));
  openSheet('Import complete',`
    ${ok.map(r=>`<div class="card tight"><div style="font-weight:750;font-size:14px">${esc(r.file)}</div>

      <div class="kv"><span class="k">New records added</span><span class="v" style="color:var(--accent)">${r.added}</span></div>

      <div class="kv"><span class="k">Duplicates skipped</span><span class="v">${r.dupes}</span></div>
      ${r.naps?`<div class="kv"><span class="k">Naps skipped</span><span class="v">${r.naps}</span></div>`:''}
      ${r.bad?`<div class="kv"><span class="k">Rows without a usable date</span><span class="v">${r.bad}</span></div>`:''}
      ${r.days?`<div class="kv"><span class="k">Total days now held</span><span class="v">${r.days}</span></div>`:''}
    </div>`).join('')}
    ${ok.some(r=>r.merged)?`<div class="note" style="margin-top:10px">Two cycles in one calendar day were merged — one decision per day. That is why days can be fewer than rows.</div>`:''}
    ${bad.map(r=>`<div class="card tight" style="border-color:var(--red-line)">

      <div class="note red" style="margin-top:8px">${esc(r.error)}</div></div>`).join('')}

  `,`<button class="btn primary big block" onclick="closeSheet()">Done</button>`,()=>render());
});

let SETTAB='profile';
/* Shows one group and hides the rest. The segment bar it used to also
   update is gone; $$ on a missing selector is simply empty. */
function setPane(id){
  SETTAB=id;
  $$('#view .spane').forEach(el=>el.classList.toggle('on', el.classList.contains(id)));
  $$('#setSeg button').forEach(b=>b.classList.toggle('on', b.dataset.p===id));
  const v=$('#view'); if(v) v.scrollTop=0;
  window.scrollTo(0,0);

/* Settings and Metrics are reached, not navigated to. Keeping them as page
   builders means the whole of both screens works unchanged. */
function openSettings(){ pushPage({build:viewSettings}); }

     <div class="kv"><span class="k">Schedule</span><span class="v">${P.daysPerWeek||4} days × ${P.sessionMin} min</span></div>
   </div>

   <div class="card spane training">

     <div style="display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:6px;font-size:9.5px;font-weight:800;letter-spacing:.4px">
       <div style="width:${S.bands.orange}%;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--on-band)">RED</div>
       <div style="width:${S.bands.yellow-S.bands.orange}%;background:var(--orange);display:flex;align-items:center;justify-content:center;color:var(--on-band)">ORANGE</div>
       <div style="width:${S.bands.green-S.bands.yellow}%;background:var(--yellow);display:flex;align-items:center;justify-content:center;color:var(--on-band)">YELLOW</div>
       <div style="width:${100-S.bands.green}%;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--on-band)">GREEN</div>
     </div>
     <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-weight:700;margin-bottom:16px">

     </div>

     ${[['green','Green starts at','var(--green)','Full session at the prescribed effort'],
        ['yellow','Yellow starts at','var(--yellow)','Same session, fewer sets, effort capped'],

       .map(([k,l,col,what])=>`<div class="slider-row">

       </div>`).join('')}

     </div>

   </div>

     <button class="btn ghost block" id="sSched">${svg('edit')} Edit weekly targets</button>

     <button class="btn ${Store.durable?'ghost':'primary'} block" id="sSetup" style="margin-top:12px">
       ${Store.durable?'Add to Home Screen &amp; storage details':'Fix storage — how to install properly'}</button>
   </div>

     <div class="kv"><span class="k">Wearable</span><span class="v">${srcMark()}${esc(sourceOf().name)}</span></div>

     <div class="kv"><span class="k">Days on this device</span><span class="v">${DB.whoop.cycles.length}</span></div>
     <div class="kv"><span class="k">Baselines</span><span class="v">${DB.baselines.computed?'Computed from your data':'Not established'}</span></div>
     <div class="btn-row" style="margin-top:13px">
       <button class="btn ghost sm" id="sImpWhoop">${svg('ul')} ${usesDevice()?'Import '+esc(SRC_NAME())+' CSV':'Add a wearable'}</button>
       ${DB.whoop.cycles.length?`<button class="btn ghost sm" id="sDelWhoop">Remove imported data</button>`:''}
     </div>
     <div class="hint" style="margin-top:9px">${hasWhoop()

         ? `The app works fully without importing anything — you can type this morning's numbers into the check-in instead. Importing adds history, so your baselines are yours rather than general ranges.`
         : 'The app is running entirely from your check-ins and training log, which is enough. Add a wearable any time and its numbers join the daily decision.'}</div>
   </div>

   <div class="card spane data">
     <div class="card-t accent" style="margin-bottom:12px">Your data</div>
     <div class="kv"><span class="k">Stored in</span><span class="v">${esc(Store.mode)}, this browser only</span></div>
     <div class="kv"><span class="k">Approx. size</span><span class="v" id="sSize">—</span></div>
     <div class="kv"><span class="k">Last backup</span><span class="v" style="color:${DB.meta.lastBackup?'var(--text-2)':'var(--orange)'}">${
        DB.meta.lastBackup?esc(new Date(DB.meta.lastBackup).toLocaleString()):'never'}</span></div>
     <div class="btn-row" style="margin-top:14px">
       <button class="btn ${DB.meta.lastBackup?'ghost':'primary'} sm" id="expJson">${svg('dl')} Backup JSON</button>
       <button class="btn ghost sm" id="impJson">${svg('ul')} Restore JSON</button>
     </div>
     <div class="btn-row" style="margin-top:9px">
       <button class="btn ghost sm" id="expCsvS">Sessions CSV</button>
       <button class="btn ghost sm" id="expCsvA">Activities CSV</button>
       ${DB.whoop.cycles.length?`<button class="btn ghost sm" id="expCsvW">Metrics CSV</button>`:''}
     </div>
     <div class="note warn" style="margin-top:13px"><b>Your data is stored locally on this device.</b> If you clear browser data or change devices, restore your backup to recover it. Clearing website data erases everything instantly, and no copy exists anywhere else.</div>
   </div>

   <div class="card spane data">
     <div class="card-t" style="margin-bottom:10px">Using more than one device</div>
     <p style="font-size:13px;line-height:1.6;color:var(--text-2)">Each browser on each device keeps its <b>own separate</b> dataset. Your phone's history is not on your PC, and there is no sync — that is the price of having no account and no server.</p>
     <div class="kv" style="margin-top:8px"><span class="k">To move data across</span><span class="v">Export JSON → send the file → Import JSON</span></div>
     <div class="hint" style="margin-top:6px">That is a one-time snapshot. Changes made afterwards on either device will not appear on the other.</div>
   </div>

   <div class="card spane about">
     <div class="card-t" style="margin-bottom:10px">Privacy</div>
     <ul class="why" style="border:none;padding:0;margin:0">
       <li class="pos"><span class="dot"></span><span>No analytics, no tracking, no advertising, no external services.</span></li>
       <li class="pos"><span class="dot"></span><span>No network requests of any kind — the app works fully offline.</span></li>
       <li class="pos"><span class="dot"></span><span>CSV exports are parsed in your browser; the files never leave your device.</span></li>
       <li class="pos"><span class="dot"></span><span>All data sits in <span class="mono">localStorage</span> (mirrored to <span class="mono">IndexedDB</span>) under the key <span class="mono">baseline.tps.v1</span>.</span></li>
     </ul>
   </div>


   <div class="card spane about">
     <div class="card-t accent" style="margin-bottom:10px">Version &amp; problem reports</div>
     <div class="kv"><span class="k">Build</span><span class="v num">${esc(APP_BUILD)}</span></div>
     <div class="kv"><span class="k">Storage format</span><span class="v num">v${SCHEMA_VERSION}</span></div>
     <div class="kv"><span class="k">Running as</span><span class="v">${

          ? 'Installed app' : 'Browser tab'}</span></div>
     <div class="hint" style="margin-top:8px">Quote the build number in any bug report.</div>

     <div class="hint" style="margin-top:8px">Device, browser, storage and how much you have logged. <b>Counts only</b>, never what you entered.</div>
   </div>
   <div class="card spane data">
     <div class="card-t" style="margin-bottom:10px;color:var(--red)">Danger zone</div>
     <button class="btn danger block" id="rsProg">Reset program to defaults</button>
     <div class="hint" style="margin-top:7px;margin-bottom:14px">Restores the default
       workouts, exercises and weekly targets. <b>Your history is kept.</b></div>
     <button class="btn danger block" id="rsAll">Erase all data</button>
     <div class="hint" style="margin-top:7px">Deletes everything on this device —
       check-ins, sessions, activities, tests, measurements and any imported
       wearable data. <b>This cannot be undone.</b></div>
   </div>

   <div class="spane about" style="text-align:center;padding:20px 0 8px;color:var(--text-3);font-size:11px">
