/* has this device recorded anything at all? */
function hasHistory(){
  return (DB.sessions||[]).some(s=>s.done) || (DB.activities||[]).length>0 || DB.whoop.cycles.length>0;
}
/* honest wording: "never logged" is not the same as "over 2 weeks ago" */
function sinceText(n){
  if(!hasHistory()) return 'never logged';
  if(n===99) return 'over 2 weeks ago';
  if(n===1) return 'yesterday';
  return n+' days ago';
}

/* ---- daily activity summary + tomorrow implication ---- */
function dailySummaryCard(d){
  const dd=dayDemand(d);
  if(!dd.n) return `<div class="card tight"><div class="empty" style="padding:20px">
    <p>Nothing logged yet today. Anything you do — planned or not — can be logged and will feed straight into tomorrow's recommendation.</p></div></div>`;
  const b=loadBand(dd.load);
  const groups={};
  dd.items.forEach(i=>{
    const k = i.kind==='session' ? 'Strength' : (ACT_TYPES[i.type]||ACT_TYPES.other).name;
    groups[k]=groups[k]||{min:0,load:0,n:0};
    groups[k].min+=i.min||0; groups[k].load+=i.load||0; groups[k].n++;
  });
  const tomorrow = dd.expl>=8 ? 'Explosive demand is high — tomorrow avoids plyometrics and hard change of direction.'
    : dd.lower>=12 ? 'Heavy lower-body day — tomorrow will move to upper body or recovery work.'
    : dd.lower>=8  ? 'Real lower-body load — tomorrow\'s leg volume will be trimmed.'
    : dd.upper>=8  ? 'Notable upper-body load — tomorrow\'s pressing and pulling volume will be reduced.'
    : dd.load>=12  ? 'High total load — tomorrow will be pulled back regardless of the schedule.'
    : dd.load<=4   ? 'Light day — no carry-over. Tomorrow can be trained properly.'
    : 'Moderate load — tomorrow\'s plan stands unless your recovery numbers say otherwise.';
  return `<div class="card">
    <div class="card-h"><div class="card-t">Total activity load</div>
      <span class="chip ${b.cls}">${b.label} · ${dd.load}</span></div>
    ${Object.entries(groups).map(([k,g])=>`<div class="kv"><span class="k">${esc(k)}${g.n>1?` ×${g.n}`:''}</span>
      <span class="v">${g.min} min · load ${rnd(g.load,1)}</span></div>`).join('')}
    <div class="divider"></div>
    <div class="card-t" style="margin-bottom:9px">Demand breakdown</div>
    ${[['Lower body',dd.lower,'a'],['Upper body',dd.upper,'c'],['Explosive',dd.expl,'o'],['Impact',dd.impact,'r']].map(([l,v,cl])=>
      `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="color:var(--text-2);font-weight:600">${l}</span><span class="num" style="font-weight:750">${v}</span></div>
        <div class="bar ${cl}"><i style="width:${clamp(v/18*100,0,100)}%"></i></div></div>`).join('')}
    <div class="note ${dd.expl>=8||dd.lower>=12?'warn':'acc'}" style="margin-top:12px"><b>Effect on tomorrow:</b> ${tomorrow}</div>
    <div class="hint" style="margin-top:8px">Load Score is this app's own estimate from activity type, duration and RPE — not a WHOOP measurement. Where WHOOP strain exists for a day, the engine uses that for the day total.</div>
  </div>`;
}

function todayPlan(d){
  const ci=DB.checkins[d], ovr=DB.plans[d], rec=recommend(d,ci);
  return ovr ? Object.assign({},rec,{workoutId:ovr.workoutId,variant:ovr.variant,addCore:!!ovr.addCore,
    label:ovr.label||rec.label,emoji:ovr.emoji||rec.emoji,est:ovr.est||rec.est,id:ovr.id||rec.id,overridden:true}) : rec;
}
function wireToday(d){
  const on=(id,fn)=>{ const b=$('#'+id); if(b)b.onclick=fn; };
  on('btnCheck',()=>openCheckin(d));
  on('btnEditCi',()=>openCheckin(d));
  on('btnStart',()=>{ const p=todayPlan(d); startWorkout(p.workoutId,p.variant,d,p); });
  on('btnPreview',()=>{ const p=todayPlan(d); previewWorkout(p.workoutId,p.variant,p); });
  on('btnSwap',()=>changePlan(d));
  on('btnPrep',()=>previewWorkout('w_prep','full'));
  on('btnQuickLog',()=>activitySheet(null,d));
  on('btnQuickLog2',()=>activitySheet(null,d));
  on('setupGo',()=>startSetup());
  on('setupDismiss',()=>{
    DB.profile.onboarded=true; save(true); renderNav(); render();
    toast('Using defaults — change them any time in Settings');
  });
  ['accReady','accOpts'].forEach(id=>{
    const h=$('#'+id+'H'); if(h) h.onclick=()=>$('#'+id).classList.toggle('open');
  });
}

/* ---- user override: [CHANGE TODAY'S PLAN] ---- */
function changePlan(d){
  const rec=recommend(d,DB.checkins[d]);
  const cur=DB.plans[d];
  openSheet("Change today's plan",`
   <div class="note acc" style="margin-bottom:14px">Overriding is not a failure — whatever you actually do gets logged and feeds straight back into tomorrow's recommendation.</div>
   <div class="card-t" style="margin-bottom:9px">Ranked by today's data</div>
   ${rec.scored.map(x=>{
     const wk=x.wid?DB.workouts.find(w=>w.id===x.wid):null;
     const isRec = x.c.id===rec.id && !cur;
     const isCur = cur && cur.id===x.c.id;
     return `<button class="card tight" data-pick="${x.c.id}" style="display:block;width:100%;text-align:left;margin-bottom:8px;${isRec||isCur?'border-color:var(--accent)':''}">
       <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
         <div style="flex:1;min-width:0">
           <div style="font-size:14.5px;font-weight:750">${x.c.emoji} ${esc(x.c.label)}</div>
           <div style="font-size:11.5px;color:${x.blocked?'var(--orange)':'var(--text-3)'};margin-top:4px;line-height:1.45">
             ${x.blocked?'Engine advises against: '+esc(x.blocked):esc((wk&&wk.focus)||x.c.goal).slice(0,90)}</div>
         </div>
         <div style="text-align:right;flex:0 0 auto">
           ${isRec?'<span class="tag a">PICKED</span>':isCur?'<span class="tag v">YOURS</span>':''}
           ${wk?`<div style="font-size:11px;color:var(--text-3);margin-top:4px;font-weight:650">${wk.est.full} min</div>`:''}
         </div>
       </div></button>`;}).join('')}
   <div class="divider"></div>
   <div class="card-t" style="margin-bottom:9px">Or pick any session directly</div>
   ${DB.workouts.map(w=>`<button class="row tap" data-w="${w.id}" style="display:flex;width:100%;text-align:left;background:var(--surface);border-radius:11px;margin-bottom:6px;border:1px solid var(--border-soft)">
     <div class="rt"><div class="rn" style="font-size:13.5px">${esc(w.name)}</div><div class="rs">${esc(w.focus)}</div></div>
     <span class="chev">${svg('chev')}</span></button>`).join('')}
   ${cur?`<button class="btn ghost block" id="cpClear" style="margin-top:12px">${svg('undo')} Back to the engine's pick</button>`:''}
  `);
  $$('[data-pick]',$('#sheetBody')).forEach(b=>b.onclick=()=>{
    const x=rec.scored.find(s=>s.c.id===b.dataset.pick);
    if(!x.wid){ DB.plans[d]={id:x.c.id,workoutId:null,variant:'full',label:x.c.label,emoji:x.c.emoji,est:0};
      save(true); closeSheet(); toast('Plan updated'); setTimeout(render,220); return; }
    closeSheet(); setTimeout(()=>pickVariantFor(d,x.wid,x.c),240);
  });
  $$('[data-w]',$('#sheetBody')).forEach(b=>b.onclick=()=>{
    closeSheet(); setTimeout(()=>pickVariantFor(d,b.dataset.w,null),240); });
  const cc=$('#cpClear'); if(cc)cc.onclick=()=>{ delete DB.plans[d]; save(true); closeSheet(); toast('Back to the recommendation'); setTimeout(render,220); };
}
function pickVariantFor(d,wid,cand){
  const w=DB.workouts.find(x=>x.id===wid);
  openSheet('Which version?',`
   <p class="hint" style="margin-bottom:14px">${esc(w.name)}</p>
   ${[['full','FULL','Everything as prescribed.'],['reduced','REDUCED','Fewer sets, effort capped.'],
      ['recovery','RECOVERY','Movement quality only, no fatigue.']].map(([v,l,ds])=>
     `<button class="card tight" data-v="${v}" style="display:block;width:100%;text-align:left;margin-bottom:9px">
       <div style="display:flex;justify-content:space-between;align-items:center">
         <div><div style="font-weight:800;font-size:14px">${l}</div>
         <div style="font-size:12px;color:var(--text-3);margin-top:3px">${ds}</div></div>
         <span class="chip">${w.est[v]} min</span></div></button>`).join('')}
  `);
  $$('[data-v]',$('#sheetBody')).forEach(b=>b.onclick=()=>{
    DB.plans[d]={id:cand?cand.id:catOfWorkout(w),workoutId:wid,variant:b.dataset.v,
      label:cand?cand.label:w.name, emoji:cand?cand.emoji:'🏠', est:w.est[b.dataset.v]};
    save(true); closeSheet(); toast('Plan updated','ok'); setTimeout(()=>{ if(TAB!=='today')go('today'); else render(); },220);
  });
}

/* =========================================================================
   DAILY CHECK-IN
   ====================================================================== */
function openCheckin(d){
  const cy=cycleByDate(d), prev=cycleByDate(addDays(d,-1));
  const ex=DB.checkins[d]||{};
  const g=(k,f)=> ex[k]!=null?ex[k] : (cy&&cy[f]!=null?cy[f]:'');
  const prevStrain = ex.prevStrain!=null?ex.prevStrain : (prev&&prev.strain!=null?prev.strain:'');
  const src = cy? '<span class="src whoop">from whoop</span>' : '<span class="src you">enter manually</span>';
  const dow=dowOf(d);
  const loggedTen = DB.activities.some(a=>a.date===d&&['tennis','padel','squash'].includes(a.type));
  const tenDef = ex.tennisToday!=null ? ex.tennisToday : loggedTen;

  const useWhoop = hasWhoop() || whoopMode();
  openSheet('Daily check-in · '+fmtDate(d),`
   ${useWhoop?`
   <div class="card-t" style="margin-bottom:10px">WHOOP numbers ${src}</div>
   <div class="grid2">
     <div class="field"><label>Recovery %</label><input class="inp num" type="number" inputmode="numeric" id="ciRec" min="0" max="100" value="${g('recovery','recovery')}" placeholder="—"></div>
     <div class="field"><label>HRV (ms)</label><input class="inp num" type="number" inputmode="numeric" id="ciHrv" min="0" max="300" value="${g('hrv','hrv')}" placeholder="—"></div>
     <div class="field"><label>Resting HR</label><input class="inp num" type="number" inputmode="numeric" id="ciRhr" min="20" max="120" value="${g('rhr','rhr')}" placeholder="—"></div>
     <div class="field"><label>Sleep perf %</label><input class="inp num" type="number" inputmode="numeric" id="ciSp" min="0" max="100" value="${g('sleepPerf','sleepPerf')}" placeholder="—"></div>
   </div>`
   :`<div class="note" style="margin-bottom:16px">No WHOOP connected — these questions are all you need. The engine uses your answers plus your training history.</div>`}
   <div class="field"><label>Sleep duration</label>
     <div class="grid2">
       <input class="inp num" type="number" inputmode="numeric" id="ciSh" min="0" max="16" placeholder="hours" value="${(()=>{const m=ex.sleepMin!=null?ex.sleepMin:(cy&&cy.sleepMin); return m!=null?Math.floor(m/60):'';})()}">
       <input class="inp num" type="number" inputmode="numeric" id="ciSm" min="0" max="59" placeholder="minutes" value="${(()=>{const m=ex.sleepMin!=null?ex.sleepMin:(cy&&cy.sleepMin); return m!=null?Math.round(m%60):'';})()}">
     </div><div class="hint">${cy&&cy.sleepNeed?`WHOOP put last night's need at <b>${fmtMin(cy.sleepNeed)}</b>`:`Your typical modelled need is <b>${fmtMin(DB.baselines.sleepNeed)}</b> (WHOOP recalculates it nightly)`}. Staying within 60 min of it is where your recovery holds up.</div></div>
   ${useWhoop?`<div class="field"><label>Yesterday's day strain</label>
     <input class="inp num" type="number" inputmode="decimal" step="0.1" id="ciPs" min="0" max="21" value="${prevStrain}" placeholder="0.0 – 21.0">
     <div class="hint">From WHOOP. Strain of <b>${DB.settings.hardStrain}+</b> usually costs real recovery the next day.</div></div>`
   :`<div class="hint" style="margin-bottom:16px">Yesterday's load is calculated from what you logged — estimated at <b>${rnd(dayDemand(addDays(d,-1)).load,1)}</b>. Log your activities and it stays accurate.</div>`}

   <div class="divider"></div>
   <div class="card-t" style="margin-bottom:14px">How you feel <span class="src you">your input</span></div>
   ${sliderHTML('ciEn','Energy',ex.energy??6,'Drained','Excellent')}
   ${sliderHTML('ciSo','Muscle soreness',ex.soreness??3,'None','Severe')}
   ${sliderHTML('ciSt','Stress',ex.stress??4,'Calm','Very high')}
   ${sliderHTML('ciMo','Motivation',ex.motivation??7,'None','Very high')}

   <div class="field"><label>Pain (joint / sharp / unusual)</label>
     <div class="pills" id="ciPain">
       ${['None','Mild','Moderate','Significant'].map(p=>`<button data-v="${p}" class="${(ex.pain||'None')===p?'on':''}">${p}</button>`).join('')}
     </div>
     <div class="hint">Moderate or significant pain automatically removes loaded training. Persistent pain should be assessed by a qualified healthcare professional.</div></div>

   <div class="field"><label>Playing tennis today?</label>
     <div class="seg acc" id="ciTen">
       <button data-v="1" class="${tenDef?'on':''}">Yes</button>
       <button data-v="0" class="${!tenDef?'on':''}">No</button>
     </div>
     <div class="hint">Tennis is never scheduled. Saying yes here makes the engine avoid heavy legs, running and plyometrics today and offer pre-court activation instead.</div></div>

   <div class="field"><label>Time available for training</label>
     <div class="pills" id="ciTime">
       ${[20,30,45,60,90].map(t=>`<button data-v="${t}" class="${(ex.availTime??DB.profile.sessionMin)==t?'on':''}">${t} min</button>`).join('')}
     </div></div>

   <div class="field"><label>Notes (optional)</label>
     <textarea class="inp" id="ciNotes" placeholder="Anything worth remembering — travel, illness, a tough match, poor sleep…">${esc(ex.notes||'')}</textarea></div>
  `,`<button class="btn primary big block" id="ciSave">Save check-in</button>`);

  $$('#ciPain button').forEach(b=>b.onclick=()=>{ $$('#ciPain button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); haptic(); });
  $$('#ciTen button').forEach(b=>b.onclick=()=>{ $$('#ciTen button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); haptic(); });
  $$('#ciTime button').forEach(b=>b.onclick=()=>{ $$('#ciTime button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); haptic(); });

  $('#ciSave').onclick=()=>{
    const nv=id=>{ const e=$(id); if(!e||e.value==='')return null; const n=parseFloat(e.value); return isNaN(n)?null:n; };
    const h=nv('#ciSh'), m=nv('#ciSm');
    const sleepMin = (h==null&&m==null)?null:((h||0)*60+(m||0));
    const painB=$('#ciPain button.on'), tenB=$('#ciTen button.on'), timB=$('#ciTime button.on');
    /* without WHOOP these fields do not exist and stay null — never faked */
    const est=dayDemand(addDays(d,-1)).load;
    DB.checkins[d]=Object.assign({},DB.checkins[d],{
      date:d,
      recovery:nv('#ciRec'), hrv:nv('#ciHrv'), rhr:nv('#ciRhr'),
      sleepPerf:nv('#ciSp'),
      sleepMin,
      prevStrain: useWhoop ? nv('#ciPs') : (est>0?est:null),
      prevStrainEstimated: !useWhoop,
      sleepNeed:(cy&&cy.sleepNeed)||(DB.baselines.sleepNeedGeneric?null:DB.baselines.sleepNeed),
      resp:(cy&&cy.resp)||null,
      energy:+$('#ciEn').value, soreness:+$('#ciSo').value,
      stress:+$('#ciSt').value, motivation:+$('#ciMo').value,
      pain:painB?painB.dataset.v:'None',
      tennisToday: tenB? tenB.dataset.v==='1' : null,
      availTime: timB? +timB.dataset.v : null,
      notes:$('#ciNotes').value.trim(),
      at:new Date().toISOString()
    });
    save(true); closeSheet(); toast('Check-in saved','ok');
    setTimeout(()=>{ if(TAB!=='today') go('today'); else render(); },200);
  };
}
function sliderHTML(id,label,val,lo,hi){
  return `<div class="slider-row">
    <div class="slider-top"><span class="l">${esc(label)}</span><span class="v num" id="${id}_o">${val}</span></div>
    <input type="range" id="${id}" min="1" max="10" step="1" value="${val}" data-out="${id}_o">
    <div class="scale"><span>${esc(lo)}</span><span>${esc(hi)}</span></div></div>`;
}

      <button data-t="program">Program</button><button data-t="library">Exercises</button>
      <button data-t="warmups">Warm-ups</button><button data-t="history">History</button>

  ({program:paneProgram,library:paneLibrary,warmups:paneWarmups,history:paneHistory}[WTAB])($('#wBody'));

}

function editSchedule(){
  const T=DB.targets;
  const F=[['lower','Lower body strength',0,5],['upper','Upper body strength',0,5],
           ['power','Power / plyometrics',0,3],['core','Core',0,6],

         <div style="width:24px;height:24px;border-radius:7px;background:var(--surface-3);flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--text-3)">${i+1}</div>

           ${b.note?`<div class="note" style="margin-top:9px;font-size:11.5px">${esc(b.note)}</div>`:''}
           ${e.prog?`<div style="font-size:11.5px;color:var(--text-3);margin-top:7px;line-height:1.5"><b>Progress:</b> ${esc(e.prog)}</div>`:''}
           ${e.subs?`<div style="font-size:11.5px;color:var(--text-3);margin-top:4px;line-height:1.5"><b>Swap for:</b> ${esc(e.subs)}</div>`:''}
         </div></div></div>`;}).join('')
    :'<div class="empty"><p>No exercises in this version yet. Use Edit to add some.</p></div>'}

function editWorkout(wid){
  const w=DB.workouts.find(x=>x.id===wid); if(!w)return;
  let V='full';
  const draw=()=>{
    const blocks=w.blocks[V];
    openSheet('Edit · '+w.name,`
     <div class="field"><label>Workout name</label><input class="inp" id="ewName" value="${esc(w.name)}"></div>
     <div class="grid2">
       <div class="field"><label>Short name</label><input class="inp" id="ewShort" value="${esc(w.short)}"></div>
       <div class="field"><label>Type</label><select class="inp" id="ewType">
         ${['strength','power','core','cardio','mobility','tennis'].map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}
       </select></div>
     </div>
     <div class="field"><label>Focus</label><input class="inp" id="ewFocus" value="${esc(w.focus)}"></div>
     <div class="field"><label>Description</label><textarea class="inp" id="ewDesc">${esc(w.desc||'')}</textarea></div>
     <div class="grid2">
       <div class="field"><label>Warm-up</label><select class="inp" id="ewWarm">
         ${Object.keys(WARMUPS).map(k=>`<option value="${k}" ${w.warm===k?'selected':''}>${esc(WARMUPS[k].name)}</option>`).join('')}</select></div>
       <div class="field"><label>Cool-down</label><select class="inp" id="ewCool">
         ${Object.keys(COOLDOWNS).map(k=>`<option value="${k}" ${w.cool===k?'selected':''}>${esc(COOLDOWNS[k].name)}</option>`).join('')}</select></div>
     </div>
     <div class="grid3">
       <div class="field"><label>Full min</label><input class="inp num" type="number" id="ewEf" value="${w.est.full}"></div>
       <div class="field"><label>Red. min</label><input class="inp num" type="number" id="ewEr" value="${w.est.reduced}"></div>
       <div class="field"><label>Rec. min</label><input class="inp num" type="number" id="ewEc" value="${w.est.recovery}"></div>
     </div>
     <div class="divider"></div>
     <div class="card-t" style="margin-bottom:10px">Exercises — which version?</div>
     <div class="seg sm" id="ewSeg" style="margin-bottom:12px">
       ${['full','reduced','recovery'].map(x=>`<button data-v="${x}" class="${x===V?'on':''}">${x.toUpperCase()} (${w.blocks[x].length})</button>`).join('')}
     </div>
     ${blocks.length?blocks.map((b,i)=>{ const e=exOf(b.ex);
       return `<div class="card tight" style="margin-bottom:8px">
         <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
           <b style="flex:1;font-size:13.5px">${i+1}. ${e?esc(e.name):'<span style="color:var(--red)">Missing exercise</span>'}</b>
           <button class="icon-btn" style="width:32px;height:32px" data-up="${i}">${svg('up')}</button>
           <button class="icon-btn" style="width:32px;height:32px" data-dn="${i}">${svg('down2')}</button>
           <button class="icon-btn" style="width:32px;height:32px;color:var(--red)" data-rm="${i}">${svg('trash')}</button>
         </div>
         <div class="grid2">
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">SETS</label>
             <input class="inp bEdit" data-i="${i}" data-k="sets" type="number" inputmode="numeric" value="${b.sets||''}" placeholder="${e?e.sets:''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">REPS</label>
             <input class="inp bEdit" data-i="${i}" data-k="reps" value="${esc(b.reps||'')}" placeholder="${e?esc(e.reps):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">RPE / RIR</label>
             <input class="inp bEdit" data-i="${i}" data-k="rpe" value="${esc(b.rpe||'')}" placeholder="${e?esc(e.rpe):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">REST</label>
             <input class="inp bEdit" data-i="${i}" data-k="rest" value="${esc(b.rest||'')}" placeholder="${e?esc(e.rest):''}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">TEMPO</label>
             <input class="inp bEdit" data-i="${i}" data-k="tempo" value="${esc(b.tempo||'')}" placeholder="${e&&e.tempo?esc(e.tempo):'—'}"></div>
           <div><label style="font-size:10px;color:var(--text-3);font-weight:750;letter-spacing:.5px">NOTE</label>
             <input class="inp bEdit" data-i="${i}" data-k="note" value="${esc(b.note||'')}" placeholder="optional"></div>
         </div></div>`;}).join('')
      :'<div class="empty"><p>No exercises in this version. Add one below.</p></div>'}
     <button class="btn ghost block" id="ewAdd" style="margin-top:10px">${svg('plus')} Add exercise</button>
     <div class="divider"></div>
     <button class="btn danger block" id="ewDel">${svg('trash')} Delete this workout</button>
    `,`<button class="btn primary big block" id="ewSave">Save workout</button>`);

    $$('#ewSeg button').forEach(b=>b.onclick=()=>{ commit(); V=b.dataset.v; draw(); });
    $$('[data-up]').forEach(b=>b.onclick=()=>{ commit(); const i=+b.dataset.up; if(i>0){ const a=w.blocks[V]; [a[i-1],a[i]]=[a[i],a[i-1]]; save(); draw(); }});
    $$('[data-dn]').forEach(b=>b.onclick=()=>{ commit(); const i=+b.dataset.dn; const a=w.blocks[V]; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; save(); draw(); }});
    $$('[data-rm]').forEach(b=>b.onclick=()=>{ commit(); w.blocks[V].splice(+b.dataset.rm,1); save(); draw(); });
    $('#ewAdd').onclick=()=>{ commit(); pickExercise(exid=>{ const e=exOf(exid);
      w.blocks[V].push({ex:exid,sets:e.sets,reps:e.reps,rpe:e.rpe,rest:e.rest,tempo:e.tempo||''}); save(); draw(); }); };
    $('#ewDel').onclick=()=>confirmSheet('Delete workout?',
      `<b>${esc(w.name)}</b> will be removed. Sessions you already completed with it stay in your history.`,'Delete',()=>{
        DB.workouts=DB.workouts.filter(x=>x.id!==wid);
        for(const k in DB.plans) if(DB.plans[k]&&DB.plans[k].workoutId===wid) delete DB.plans[k];
        save(true); toast('Workout deleted'); viewWorkouts($('#view'));
      },true);
    $('#ewSave').onclick=()=>{ commit(); save(true); closeSheet(); toast('Saved','ok'); setTimeout(()=>viewWorkouts($('#view')),240); };
  };
  const commit=()=>{
    if(!$('#ewName'))return;
    w.name=$('#ewName').value.trim()||w.name; w.short=$('#ewShort').value.trim()||w.short;
    w.type=$('#ewType').value; w.focus=$('#ewFocus').value.trim(); w.desc=$('#ewDesc').value.trim();
    w.warm=$('#ewWarm').value; w.cool=$('#ewCool').value;
    w.est={full:+$('#ewEf').value||40,reduced:+$('#ewEr').value||28,recovery:+$('#ewEc').value||18};
    $$('.bEdit').forEach(inp=>{ const b=w.blocks[V][+inp.dataset.i]; if(!b)return;
      const k=inp.dataset.k, val=inp.value.trim();
      if(k==='sets') b.sets=val?+val:null; else b[k]=val; });
  };
  draw();
}

}

let LQ='',LCAT='';
function paneLibrary(c){
  const cats=[...new Set(DB.exercises.map(e=>e.cat))];
  const list=DB.exercises.filter(e=>(!LCAT||e.cat===LCAT)&&
    (!LQ||e.name.toLowerCase().includes(LQ)||e.muscles.toLowerCase().includes(LQ)||(e.equip||'').toLowerCase().includes(LQ)));

            <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">
              <span class="tag ${e.cat==='lower'?'a':e.cat==='push'||e.cat==='pull'?'c':e.cat==='core'?'v':e.cat==='plyo'||e.cat==='speed'?'o':'g'}">${esc(CATNAME[e.cat]||e.cat)}</span>
              <span class="tag">${e.sets}×${esc(e.reps)}</span>
              <span class="tag">${esc(e.rpe)}</span>

/* ---------------------------------------------------------- TIMELINE */
function paneTimeline(c){
  const days=[];
  for(let i=0;i<10;i++) days.push(addDays(todayISO(),-i));
  c.innerHTML=days.map(d=>{
    const dd=dayDemand(d), ci=DB.checkins[d], cy=cycleByDate(d);
    const dow=dowOf(d);
    const plan=DB.plans[d];
    const planned=plan&&plan.workoutId?DB.workouts.find(w=>w.id===plan.workoutId):null;
    const didSession=DB.sessions.some(s=>s.date===d&&s.done);
    const b=loadBand(dd.load);
    const isToday=d===todayISO();
    const rows=[];
    if(plan && !didSession && d<=todayISO()){
      rows.push({time:'—',label:'Planned · '+(plan.label||(planned?planned.short:'session')),sub:'not completed',cls:'miss'});
    }
    dd.items.forEach(i=>{
      if(i.kind==='session'){
        rows.push({time:i.time||'—',label:'Strength · '+(i.name||'Session'),
          sub:`${i.min||0} min · load ${rnd(i.load,1)}${i.rpe?' · RPE '+i.rpe:''}`,cls:'sess'});
      } else {
        const t=ACT_TYPES[i.type]||ACT_TYPES.other;
        rows.push({time:i.time||'—',label:t.emoji+' '+t.name+(i.subtype?' · '+i.subtype:''),
          sub:`${i.min||0} min${i.dist?' · '+i.dist+' km':''} · RPE ${i.rpe||'—'} · load ${rnd(i.load,1)}`,
          cls:'act',tag:i.planned===false?'UNPLANNED':(i.planned===true?'PLANNED':''),id:i.id});
      }
    });
    if(ci&&ci.pain&&ci.pain!=='None') rows.push({time:'—',label:'Pain reported · '+ci.pain,sub:'',cls:'pain'});
    return `<div class="card">
      <div class="card-h">
        <div><div style="font-size:14.5px;font-weight:800;letter-spacing:-.2px;color:${isToday?'var(--accent)':'var(--text)'}">${isToday?'TODAY':DOW_FULL[dow].toUpperCase()}</div>
        <div style="font-size:11px;color:var(--text-3);font-weight:600;margin-top:2px">${fmtDate(d)}</div></div>

          ${dd.n?`<span class="chip ${b.cls}">${b.label} · ${dd.load}</span>`:'<span class="chip">Rest</span>'}
          ${cy&&cy.recovery!=null?`<div style="font-size:10.5px;color:var(--text-3);margin-top:4px;font-weight:650">Recovery ${cy.recovery}%</div>`:''}
        </div>
      </div>
      ${rows.length? rows.map(r=>`
        <div class="row" style="padding:10px 0;border-color:var(--border-soft)" ${r.id?`data-aid="${r.id}"`:''}>
          <div style="width:44px;font-size:11.5px;font-weight:750;color:var(--text-3)" class="num">${esc(r.time)}</div>
          <div class="rt"><div class="rn" style="font-size:13.5px;${r.cls==='miss'?'color:var(--text-3)':''}">${r.label}</div>
            ${r.sub?`<div class="rs">${esc(r.sub)}</div>`:''}</div>
          ${r.tag?`<span class="tag ${r.tag==='UNPLANNED'?'o':'g'}">${r.tag}</span>`:''}
          ${r.id?`<span class="chev">${svg('edit')}</span>`:''}
        </div>`).join('')
       :'<div style="font-size:12.5px;color:var(--text-3);padding:6px 0">Nothing logged.</div>'}
      ${dd.n?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">
        <span class="tag a">LEGS ${dd.lower}</span><span class="tag c">UPPER ${dd.upper}</span>
        <span class="tag o">EXPLOSIVE ${dd.expl}</span><span class="tag r">IMPACT ${dd.impact}</span></div>`:''}
    </div>`;}).join('');
  $$('[data-aid]',c).forEach(r=>r.onclick=()=>activitySheet(r.dataset.aid));

     <div class="note warn" style="margin-top:11px">Observation, not proof of cause. Your original 181-day export showed tennis days landing about <b>11 recovery points</b> lower the next morning, while lifting days landed slightly higher — which is why the engine protects the day after tennis.</div>

        ['Groin & hamstring protection','Copenhagen Plank, Nordic Curl, Single-Leg RDL','w_lowerB'],
        ['Conditioning','Tennis Interval Run (20s/40s), Zone 2','w_runInt']].map(([k,vv,wid])=>
       `<div class="row tap" data-w="${wid}" style="padding:11px 0">
          <div class="rt"><div class="rn" style="font-size:13.5px">${esc(k)}</div><div class="rs">${esc(vv)}</div></div>
          <span class="chev">${svg('chev')}</span></div>`).join('')}
   </div>
   <div class="sec-t">Tennis sessions</div>
   ${T.length? T.map(t=>`
     <div class="card tight" data-aid="${t.id}">
       <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
         <div><div style="font-size:14px;font-weight:750">${esc(fmtDate(t.date))}${t.time?' · '+esc(t.time):''}</div>
           <div style="font-size:11.5px;color:var(--text-3);margin-top:3px">${esc([t.subtype,t.format,t.intensity].filter(Boolean).join(' · '))||'—'}</div></div>

/* ---------------------------------------------------------- TOTALS pane */
function paneTotals(c){
  const today=todayISO();
  const weeks=[],months={};
  for(let w=0;w<8;w++){
    const end=addDays(today,-7*w), start=addDays(end,-6);
    const acts=DB.activities.filter(a=>a.date>=start&&a.date<=end);
    const sess=DB.sessions.filter(s=>s.done&&s.date>=start&&s.date<=end);
    let load=0,lower=0,expl=0;
    for(let i=0;i<7;i++){ const dd=dayDemand(addDays(start,i)); load+=dd.load; lower+=dd.lower; expl+=dd.expl; }
    weeks.push({start,end,acts:acts.length,sess:sess.length,min:sum(acts.map(a=>a.min))+sum(sess.map(s=>s.durationMin)),
      load:rnd(load,1),lower:rnd(lower,1),expl:rnd(expl,1)});
  }
  DB.activities.forEach(a=>{ const m=a.date.slice(0,7); months[m]=months[m]||{n:0,min:0,load:0,types:{}};
    months[m].n++; months[m].min+=a.min||0; months[m].load+=activityLoad(a);
    months[m].types[a.type]=(months[m].types[a.type]||0)+1; });
  const byType={};
  DB.activities.forEach(a=>{ byType[a.type]=byType[a.type]||{n:0,min:0,load:0}; byType[a.type].n++;
    byType[a.type].min+=a.min||0; byType[a.type].load+=activityLoad(a); });
  const maxLoad=Math.max(1,...weeks.map(w=>w.load));
  c.innerHTML=`
   <div class="card">
     <div class="card-h"><div class="card-t accent">Weekly load — last 8 weeks</div></div>
     <div class="chart-wrap">${barChart(weeks.slice().reverse().map((w,i)=>({v:w.load,t:i===7?'now':'',color:w.load>maxLoad*.85?'var(--orange)':'var(--accent)'})),{h:90})}</div>
     <div class="divider"></div>
     ${weeks.map((w,i)=>`<div class="kv"><span class="k">${i===0?'This week':i===1?'Last week':fmtDate(w.start)}</span>
       <span class="v">${w.sess+w.acts} sessions · ${w.min} min · load ${w.load}</span></div>`).join('')}
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Lower-body vs explosive demand</div></div>
     <div class="chart-wrap">${lineChart([
       {pts:weeks.slice().reverse().map(w=>({v:w.lower})),color:'var(--accent)',area:true},
       {pts:weeks.slice().reverse().map(w=>({v:w.expl})),color:'var(--orange)'}],{h:100,l:26})}</div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Lower body</span><span><i style="background:var(--orange)"></i>Explosive</span></div>
     <div class="hint" style="margin-top:9px">Watch for explosive demand climbing several weeks in a row without a dip — that is the pattern that precedes soft-tissue problems in racquet and field sports.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">By activity type — all time</div></div>
     ${Object.entries(byType).sort((a,b)=>b[1].load-a[1].load).map(([t,g])=>{
       const T=ACT_TYPES[t]||ACT_TYPES.other;
       return `<div class="kv"><span class="k">${T.emoji} ${esc(T.name)}</span>
         <span class="v">${g.n} × · ${fmtMin(g.min)} · load ${rnd(g.load,0)}</span></div>`;}).join('')
      ||'<div class="hint">No activities logged yet.</div>'}
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Monthly totals</div></div>
     ${Object.keys(months).sort().reverse().map(m=>`<div class="kv">
       <span class="k">${m}</span><span class="v">${months[m].n} activities · ${fmtMin(months[m].min)} · load ${rnd(months[m].load,0)}</span></div>`).join('')
      ||'<div class="hint">No activities logged yet.</div>'}
   </div>`;
}

/* ---------------------------------------------------------- ENTRY SHEET */
function activitySheet(id,defDate){
  const ex = id? DB.activities.find(a=>a.id===id) : null;
  let type = ex? ex.type : 'tennis';
  const draw=()=>{
    const T=ACT_TYPES[type];
    const a = ex || {};
    openSheet(ex?'Edit activity':'Log activity',`
     <div class="field"><label>Activity type</label>
       <div class="pills" id="asType">
         ${Object.entries(ACT_TYPES).map(([k,t])=>`<button data-v="${k}" class="${k===type?'on':''}">${t.emoji} ${esc(t.name)}</button>`).join('')}
       </div></div>

     <div class="grid2">
       <div class="field"><label>Date</label><input class="inp" type="date" id="asDate" value="${esc(a.date||defDate||todayISO())}"></div>
       <div class="field"><label>Start time <span style="text-transform:none;font-weight:600">(optional)</span></label><input class="inp" type="time" id="asTime" value="${esc(a.time||'')}"></div>
     </div>

     <div class="field"><label>Duration (minutes)</label>
       <input class="inp num" type="number" inputmode="numeric" id="asMin" value="${a.min||''}" placeholder="e.g. 90">
       <div class="pills" style="margin-top:8px">${[20,30,45,60,90,120].map(m=>`<button type="button" class="qmin" data-m="${m}">${m}</button>`).join('')}</div>
     </div>

     ${T.dist?`<div class="grid2">
       <div class="field"><label>Distance (km)</label><input class="inp num" type="number" inputmode="decimal" step="0.1" id="asDist" value="${a.dist||''}" placeholder="optional"></div>
       <div class="field"><label>Pace (min/km)</label><input class="inp" id="asPace" value="${esc(a.pace||'')}" placeholder="auto or e.g. 5:30"></div>
     </div>`:''}

     ${['tennis','padel','squash'].includes(type)?`
       <div class="field"><label>Format</label><div class="pills" id="asFormat">
         ${['Singles','Doubles','Hitting','Solo drills'].map(f=>`<button data-v="${f}" class="${a.format===f?'on':''}">${f}</button>`).join('')}</div></div>
       <div class="field"><label>Session type</label><div class="pills" id="asSubtype">
         ${['Match','Practice','Drills','Serve practice','Social'].map(f=>`<button data-v="${f}" class="${a.subtype===f?'on':''}">${f}</button>`).join('')}</div></div>`
     :`<div class="field"><label>Description <span style="text-transform:none;font-weight:600">(optional)</span></label>
        <input class="inp" id="asSubtype2" value="${esc(a.subtype||'')}" placeholder="${type==='other'?'What was it?':'e.g. intervals, easy, match'}"></div>`}

     <div class="field"><label>Intensity</label><div class="pills" id="asInt">
       ${['Easy','Moderate','Hard','Maximal'].map(f=>`<button data-v="${f}" class="${(a.intensity||'Moderate')===f?'on':''}">${f}</button>`).join('')}</div></div>

     ${sliderHTML('asRpe','Perceived effort (RPE)',a.rpe||6,'Very easy','Maximal')}

     <div class="field"><label>Was this planned?</label>
       <div class="seg acc" id="asPlan">
         <button data-v="1" class="${a.planned!==false?'on':''}">Planned</button>
         <button data-v="0" class="${a.planned===false?'on':''}">Unplanned</button>
       </div>
       <div class="hint">Unplanned is not a failure — the engine adapts the program around what actually happened rather than what was scheduled.</div>
     </div>

     <div class="field"><label>Notes</label><textarea class="inp" id="asNotes" placeholder="How it went, how you felt, anything worth remembering…">${esc(a.notes||'')}</textarea></div>

     <div class="note acc" id="asPreview"></div>
     ${ex?`<button class="btn danger block" id="asDel" style="margin-top:14px">${svg('trash')} Delete activity</button>`:''}
    `,`<button class="btn primary big block" id="asSave">${ex?'Save changes':'Log activity'}</button>`);

    const pills=(sel)=>$$(sel+' button').forEach(b=>b.onclick=()=>{
      $$(sel+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); haptic(); updPreview(); });
    pills('#asType'); pills('#asFormat'); pills('#asSubtype'); pills('#asInt'); pills('#asPlan');
    $$('#asType button').forEach(b=>b.onclick=()=>{ commitSoft(); type=b.dataset.v; draw(); });
    $$('.qmin').forEach(b=>b.onclick=()=>{ $('#asMin').value=b.dataset.m; updPreview(); });
    ['#asMin','#asRpe','#asDist'].forEach(s=>{ const e=$(s); if(e)e.addEventListener('input',updPreview); });

    function commitSoft(){ if($('#asMin')) { /* keep typed values across type switches */ } }
    function updPreview(){
      const min=+($('#asMin')||{}).value||0, rpe=+($('#asRpe')||{}).value||6;
      const tmp={type,min,rpe};
      const L=activityLoad(tmp), d=activityDemand(tmp), b=loadBand(L);
      const p=$('#asPreview'); if(!p)return;
      p.innerHTML = min? `<b>Estimated load ${L} — ${b.label}</b> (${b.note}).<br>
        Demand: legs ${rnd(d.lower,1)} · upper ${rnd(d.upper,1)} · explosive ${rnd(d.expl,1)} · impact ${rnd(d.impact,1)}.<br>
        <span style="color:var(--text-3)">This feeds tomorrow's recommendation. It is an estimate from type, duration and RPE — not a measurement.</span>`
        : 'Enter a duration to see the estimated load and how it will affect tomorrow.';
    }
    updPreview();

    if($('#asDel')) $('#asDel').onclick=()=>confirmSheet('Delete activity?','It will be removed from your history and from all load calculations.','Delete',()=>{
      DB.activities=DB.activities.filter(x=>x.id!==id); save(true); toast('Deleted'); render(); },true);

    $('#asSave').onclick=()=>{
      const min=+$('#asMin').value||0;
      if(!min){ toast('Add a duration first','err'); return; }
      const gv=sel=>{ const b=$(sel+' button.on'); return b?b.dataset.v:null; };
      let dist=$('#asDist')?(+$('#asDist').value||null):null;
      let pace=$('#asPace')?$('#asPace').value.trim():null;
      if(dist&&!pace&&min){ const p=min/dist; pace=Math.floor(p)+':'+String(Math.round((p%1)*60)).padStart(2,'0'); }
      const rec={
        id: ex? ex.id : 'a'+uid(),
        date: $('#asDate').value||todayISO(),
        time: $('#asTime').value||null,
        type, min, dist, pace,
        format: gv('#asFormat'),
        subtype: gv('#asSubtype') || ($('#asSubtype2')?$('#asSubtype2').value.trim():null),
        intensity: gv('#asInt')||'Moderate',
        rpe: +$('#asRpe').value,
        planned: gv('#asPlan')==='1',
        notes: $('#asNotes').value.trim(),
        at: new Date().toISOString()
      };
      if(ex){ Object.assign(ex,rec); } else { DB.activities.push(rec); }
      DB.activities.sort((a,b)=>a.date<b.date?-1:1);
      save(true); closeSheet(); toast(ex?'Activity updated':'Activity logged','ok');
      setTimeout(render,220);
    };
  };
  draw();
}


/* =========================================================================
   VIEW: PROGRESS  (week review · strength · tests · physique · correlations)
   ====================================================================== */
let PTAB='week';
function viewProgress(v){
  appbar('Progress','Performance and physique, tracked separately');
  v.innerHTML=`<div class="seg acc" id="pSeg" style="margin-bottom:14px">
      <button data-t="week">Week</button><button data-t="strength">Strength</button>
      <button data-t="tests">Tests</button><button data-t="physique">Physique</button>
      <button data-t="links">Links</button>
    </div><div id="pBody"></div>`;
  $$('#pSeg button').forEach(b=>{ b.classList.toggle('on',b.dataset.t===PTAB);
    b.onclick=()=>{ PTAB=b.dataset.t; viewProgress(v); }; });
  ({week:paneWeek,strength:paneStrength,tests:paneTests,physique:panePhysique,links:paneLinks}[PTAB])($('#pBody'));
  bindInputs(v);
}

/* ------------------------------------------------------------- WEEK */
function paneWeek(c){
  const today=todayISO(), start=addDays(today,-dowOf(today)), prevStart=addDays(start,-7);
  const range=(s,e)=>{ const o=[]; let d=s; while(d<=e){o.push(d);d=addDays(d,1);} return o; };
  const wk=range(start,today), pv=range(prevStart,addDays(start,-1));
  const stat=(days)=>{
    const cy=days.map(cycleByDate).filter(Boolean);
    const ci=days.map(d=>DB.checkins[d]).filter(Boolean);
    const ss=DB.sessions.filter(s=>s.done&&days.includes(s.date));
    const ac=DB.activities.filter(a=>days.includes(a.date));
    let load=0,lower=0,expl=0; days.forEach(d=>{const dd=dayDemand(d);load+=dd.load;lower+=dd.lower;expl+=dd.expl;});
    return {
      rec:mean(cy.map(x=>x.recovery)), hrv:mean(cy.map(x=>x.hrv)), rhr:mean(cy.map(x=>x.rhr)),
      sleep:mean(cy.map(x=>x.sleepMin)), strain:mean(cy.map(x=>x.strain)), debt:mean(cy.map(x=>x.sleepDebt)),
      sessions:ss.length, acts:ac.length, tennis:ac.filter(a=>['tennis','padel','squash'].includes(a.type)).length,
      min:sum(ss.map(s=>s.durationMin))+sum(ac.map(a=>a.min)),
      vol:sum(ss.map(s=>s.volume)), sets:sum(ss.map(s=>s.setsDone)),
      load:rnd(load,1), lower:rnd(lower,1), expl:rnd(expl,1),
      sore:mean(ci.map(x=>x.soreness)), energy:mean(ci.map(x=>x.energy)),
      days, nCy:cy.length
    };
  };
  const A=stat(wk), P=stat(pv);
  const dl=(a,b,dp)=>{ if(a==null||b==null)return ''; const d=a-b;
    return `<span class="${d>0?'up':d<0?'down':'flat'}">${d>0?'▲':d<0?'▼':'–'} ${Math.abs(rnd(d,dp||0))}</span>`; };

  // target attainment across the whole week, plus genuinely blank days
  const T=DB.targets, WP=weekProgress(today);
  const tgtTotal=['lower','upper','power','core','run','bike','mobility'].reduce((s,k)=>s+(T[k]||0),0);
  const tgtDone =['lower','upper','power','core','run','bike','mobility'].reduce((s,k)=>s+Math.min(T[k]||0,WP[k]||0),0);
  const compl=A.sessions;
  const missed=wk.filter(d=>d<today&&!DB.sessions.some(s=>s.date===d&&s.done)&&!DB.activities.some(a=>a.date===d));

  // narrative
  const good=[],attn=[];
  if(A.sessions>=3) good.push(`${A.sessions} strength sessions completed — at or above the 3/week target that your data supports.`);
  if(A.rec!=null&&P.rec!=null&&A.rec>P.rec+3) good.push(`Average recovery is up ${rnd(A.rec-P.rec,1)} points on last week.`);
  if(A.sleep!=null&&A.sleep>=DB.baselines.sleepNeed-60) good.push(`Sleep averaged ${fmtMin(A.sleep)} — inside the 60-minute window where your recovery holds.`);
  if(A.hrv!=null&&P.hrv!=null&&A.hrv>P.hrv+2) good.push(`HRV averaged ${rnd(A.hrv,0)} ms, up ${rnd(A.hrv-P.hrv,1)} on last week.`);
  if(A.acts>0) good.push(`${A.acts} activities logged, so the engine had real data to adapt from rather than assumptions.`);
  if(A.sleep!=null&&A.sleep<DB.baselines.sleepNeed-60) attn.push(`Sleep averaged ${fmtMin(A.sleep)} against a ${fmtMin(DB.baselines.sleepNeed)} need — past the 60-minute cliff where your recovery has historically dropped 11–16 points.`);
  if(missed.length>=2) attn.push(`${missed.length} day${missed.length>1?'s':''} with nothing logged at all (${missed.map(fmtDate).join(', ')}). Rest days are fine — unlogged days just leave the engine guessing.`);
  if(A.sessions<2) attn.push(`Only ${A.sessions} strength session${A.sessions===1?'':'s'} this week. Your six-month average was 1.4/week and that period showed a declining HRV trend.`);
  if(A.expl>=20) attn.push(`Explosive demand totalled ${A.expl} this week — high. Watch for accumulating soreness in the calves and hamstrings.`);
  if(A.sore!=null&&A.sore>=6) attn.push(`Average soreness ${rnd(A.sore,1)}/10 — elevated. Consider an extra easy day before the next power session.`);
  if(A.rhr!=null&&DB.baselines.rhr&&A.rhr>DB.baselines.rhr+2) attn.push(`Resting HR averaged ${rnd(A.rhr,1)} vs a ${rnd(DB.baselines.rhr,1)} baseline.`);

  const next=[];
  if(A.sleep!=null&&A.sleep<DB.baselines.sleepNeed-60) next.push('Anchor your wake time to within 30 minutes all seven days — wake-time regularity was the strongest timing signal in your export (r = −0.32 against recovery).');
  if(A.sessions<3) next.push('Target three strength sessions. Lifting is the one hard activity in your history that did not cost you recovery the next day.');
  if(A.expl>=20) next.push('Cut one plyometric block next week and keep the jump quality high rather than the volume.');
  if(!next.length) next.push('Hold this pattern. It is working — repeat it before adding anything.');

  c.innerHTML=`
  <div class="stats c2">
    ${statTile('Avg recovery',A.rec!=null?rnd(A.rec,0):null,'%',A.rec>=67?'g':A.rec>=34?'y':'r',dl(A.rec,P.rec))}
    ${statTile('Avg HRV',A.hrv!=null?rnd(A.hrv,0):null,'ms','c',dl(A.hrv,P.hrv))}
    ${statTile('Avg RHR',A.rhr!=null?rnd(A.rhr,1):null,'bpm','',dl(A.rhr,P.rhr,1))}
    ${statTile('Avg sleep',A.sleep!=null?fmtMin(A.sleep):null,'',A.sleep>=DB.baselines.sleepNeed-60?'g':'o',dl(A.sleep,P.sleep))}
  </div>
  <div class="stats" style="margin-top:9px">
    ${statTile('Sessions',A.sessions,'','a',`vs ${P.sessions}`)}
    ${statTile('Activities',A.acts,'','g',`${A.tennis} tennis`)}
    ${statTile('Week load',A.load,'','o',dl(A.load,P.load,1))}
  </div>

  <div class="card" style="margin-top:12px">
    <div class="card-h"><div class="card-t accent">Weekly targets met</div>
      <span class="tag ${tgtDone>=tgtTotal*0.8?'g':'o'}">${tgtDone}/${tgtTotal}</span></div>
    <div class="bar ${tgtDone>=tgtTotal*0.8?'g':'o'}"><i style="width:${tgtTotal?clamp(tgtDone/tgtTotal*100,0,100):0}%"></i></div>
    <div class="hint" style="margin-top:8px">${compl} sessions · ${A.sets||0} sets · ${rnd(A.vol,0)||0} kg·reps · ${fmtMin(A.min)} total activity time.
    Targets are guidelines — falling short because your recovery said so is the system working, not failing.</div>
  </div>

  <div class="card">
    <div class="card-h"><div class="card-t">Recovery &amp; HRV this week</div></div>
    <div class="chart-wrap">${lineChart([
      {pts:wk.map(d=>({v:(cycleByDate(d)||{}).recovery})),color:'var(--accent)',area:true},
     ],{h:96,min:0,max:100,labels:wk.map((d,i)=>({i,t:DOW_NAME[dowOf(d)][0]}))})}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Recovery %</span></div>
  </div>

  <div class="card">
    <div class="card-h"><div class="card-t">Daily load</div></div>
    <div class="chart-wrap">${barChart(wk.map(d=>{const dd=dayDemand(d);
      return {v:dd.load,t:DOW_NAME[dowOf(d)][0],color:dd.load>=12?'var(--orange)':dd.load>=7?'var(--accent)':'var(--surface-3)'};}),{h:84})}</div>
    <div class="hint" style="margin-top:6px">Hard/easy alternation is the goal. Two 12+ days back to back is the pattern the engine will push back on.</div>
  </div>

  <div class="card"><div class="card-t accent" style="margin-bottom:10px">What went well</div>
    ${good.length?`<ul class="why" style="border:none;padding:0;margin:0">${good.map(g=>`<li class="pos"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul>`
      :'<div class="hint">Not enough logged this week to say. Log your sessions and activities and this fills in.</div>'}</div>

  <div class="card"><div class="card-t" style="margin-bottom:10px;color:var(--orange)">What needs attention</div>
    ${attn.length?`<ul class="why" style="border:none;padding:0;margin:0">${attn.map(g=>`<li class="warn"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul>`
      :'<div class="hint">Nothing flagged. Good week.</div>'}</div>

  <div class="card"><div class="card-t" style="margin-bottom:10px;color:var(--cyan)">Next week</div>
    <ul class="why" style="border:none;padding:0;margin:0">${next.map(g=>`<li class="info"><span class="dot"></span><span>${g}</span></li>`).join('')}</ul></div>

  <div class="note">Statements here are drawn only from what you logged and imported. Where a week has few data points, treat them as observations rather than conclusions.</div>`;
}

/* --------------------------------------------------------- STRENGTH */
function paneStrength(c){
  const done=DB.sessions.filter(s=>s.done);
  if(done.length<1){ c.innerHTML='<div class="empty"><div class="ei">📈</div><h4>No sessions yet</h4><p>Complete a workout and your exercise-by-exercise progression appears here.</p></div>'; return; }
  const byEx={};
  done.forEach(s=>s.entries.forEach(en=>{
    const sets=en.sets.filter(x=>x.done&&x.reps);
    if(!sets.length)return;
    byEx[en.exerciseId]=byEx[en.exerciseId]||{name:en.name,pts:[]};
    const tot=sum(sets.map(x=>+x.reps||0));
    const best=Math.max(...sets.map(x=>+x.reps||0));
    const vol=sum(sets.map(x=>(+x.reps||0)*(+x.weight||1)));
    byEx[en.exerciseId].pts.push({date:s.date,sets:sets.length,totReps:tot,best,vol,
      rpe:mean(sets.map(x=>+x.rpe||null))});
  }));
  const keys=Object.keys(byEx).sort((a,b)=>byEx[b].pts.length-byEx[a].pts.length);
  c.innerHTML=`
   <div class="card">
     <div class="card-h"><div class="card-t accent">Total weekly volume</div></div>
     <div class="chart-wrap">${(()=>{const w=[];for(let i=7;i>=0;i--){const e=addDays(todayISO(),-7*i),s=addDays(e,-6);
       w.push({v:sum(done.filter(x=>x.date>=s&&x.date<=e).map(x=>x.volume)),t:i===0?'now':''});} return barChart(w,{h:84});})()}</div>
     <div class="hint" style="margin-top:6px">Volume = reps × weight (bodyweight exercises count as 1 per rep). Useful as a trend, not an absolute.</div>
   </div>
   ${keys.map(k=>{
     const e=byEx[k], pts=e.pts.slice(-12);
     const first=pts[0], last=pts[pts.length-1];
     const chg=pts.length>1? last.totReps-first.totReps : null;
     return `<div class="card">
       <div class="card-h"><div class="card-t">${esc(e.name)}</div>
         <span class="tag ${chg>0?'g':chg<0?'r':''}">${pts.length} SESSIONS</span></div>
       <div class="chart-wrap">${lineChart([{pts:pts.map(p=>({v:p.totReps})),color:'var(--accent)',area:true}],{h:76,l:24})}</div>
       <div class="divider"></div>
       <div class="kv"><span class="k">Latest</span><span class="v">${last.sets} sets · ${last.totReps} total reps${last.rpe?' · RPE '+rnd(last.rpe,1):''}</span></div>
       ${pts.length>1?`<div class="kv"><span class="k">Change since first logged</span>
         <span class="v ${chg>0?'up':chg<0?'down':'flat'}">${chg>0?'+':''}${chg} reps</span></div>`:''}
       <div class="kv"><span class="k">Best single set</span><span class="v">${Math.max(...pts.map(p=>p.best))} reps</span></div>
       <div class="note ${chg>0?'acc':chg<0?'warn':''}" style="margin-top:10px;font-size:11.5px">
         ${chg>0?'Progressing — keep adding reps until you reach the top of the range, then move to the harder variation.'
          :chg<0?'Output has fallen. Check recovery and sleep before assuming you need to train harder — dropping performance is usually a fatigue signal, not a motivation one.'
          :'Holding steady. If recovery is good, add a rep per set. If recovery is poor, maintaining is the correct outcome.'}</div>
     </div>`;}).join('')}`;
}

/* ------------------------------------------------------------ TESTS */
function paneTests(c){

   <div class="note acc" style="margin-bottom:14px">Retest at the end of every 8-week block, on a <b>green</b> day, warmed up, and ideally at the same time of day. Testing on a tired day tells you about your fatigue, not your fitness.</div>
   <button class="btn primary block" id="tAdd" style="margin-bottom:14px">${svg('plus')} Record a test result</button>
   ${TESTS.map(T=>{
     const h=byT[T.id]||[];
     const last=h[h.length-1], first=h[0];
     const chg = h.length>1 ? last.value-first.value : null;
     const better = chg==null?null : (T.dir==='up'? chg>0 : chg<0);
     return `<div class="card tight">
       <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
         <div style="flex:1"><div style="font-size:14.5px;font-weight:750">${esc(T.name)}</div>
           <div style="font-size:11.5px;color:var(--text-3);margin-top:3px">${esc(T.cat)} · ${esc(T.how)}</div></div>
         <div style="text-align:right"><div style="font-size:20px;font-weight:850;letter-spacing:-.6px;color:${last?'var(--accent)':'var(--text-3)'}" class="num">${last?last.value:'—'}</div>
           <div style="font-size:10px;color:var(--text-3);font-weight:700">${esc(T.unit)}</div></div>
       </div>
       ${h.length>1?`<div class="chart-wrap" style="margin-top:9px">${lineChart([{pts:h.map(x=>({v:x.value})),color:better?'var(--green)':'var(--orange)',area:true}],{h:60,l:24,dp:1})}</div>
         <div class="kv"><span class="k">Change from first test</span><span class="v ${better?'up':'down'}">${chg>0?'+':''}${rnd(chg,1)} ${esc(T.unit)}</span></div>`:''}
       ${h.length?`<div class="hint" style="margin-top:6px">${h.length} result${h.length>1?'s':''} · last ${fmtDate(last.date)}</div>`:''}
     </div>`;}).join('')}`;
  $('#tAdd').onclick=()=>{
    openSheet('Record a test',`
      <div class="field"><label>Test</label><select class="inp" id="tSel">
        ${TESTS.map(t=>`<option value="${t.id}">${esc(t.name)} (${esc(t.unit)})</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input class="inp" type="date" id="tDate" value="${todayISO()}"></div>
      <div class="field"><label>Result</label><input class="inp num" type="number" inputmode="decimal" step="0.1" id="tVal" placeholder="value"></div>
      <div class="field"><label>Notes</label><input class="inp" id="tNote" placeholder="conditions, which side, how you felt"></div>
      <div class="note" id="tHow"></div>
    `,`<button class="btn primary big block" id="tSave">Save result</button>`);
    const upd=()=>{ const T=TESTS.find(x=>x.id===$('#tSel').value); $('#tHow').innerHTML='<b>How to test:</b> '+esc(T.how); };
    $('#tSel').onchange=upd; upd();
    $('#tSave').onclick=()=>{
      const v=parseFloat($('#tVal').value); if(isNaN(v)){toast('Enter a value','err');return;}
      DB.tests.push({id:'t'+uid(),testId:$('#tSel').value,date:$('#tDate').value,value:v,notes:$('#tNote').value.trim()});
      save(true); closeSheet(); toast('Result saved','ok'); setTimeout(()=>viewProgress($('#view')),240);
    };
  };
}

/* --------------------------------------------------------- PHYSIQUE */
function panePhysique(c){
  const P=DB.physique.slice().sort((a,b)=>a.date<b.date?-1:1);
  const F=[['weight','Weight','kg'],['waist','Waist','cm'],['chest','Chest','cm'],
           ['shoulders','Shoulders','cm'],['arm','Arm (flexed)','cm'],['thigh','Thigh','cm']];
  c.innerHTML=`
   <div class="note warn" style="margin-bottom:14px">WHOOP cannot measure body composition. Physique progress is tracked here from measurements and photos you record yourself — kept completely separate from the performance metrics so neither one distorts the other.</div>
   <button class="btn primary block" id="phAdd" style="margin-bottom:14px">${svg('plus')} Add measurements</button>
   ${P.length? F.map(([k,l,u])=>{
     const pts=P.filter(p=>p[k]!=null);
     if(pts.length<1) return '';
     const last=pts[pts.length-1], first=pts[0];
     const chg=pts.length>1?last[k]-first[k]:null;
     return `<div class="card tight">
       <div style="display:flex;justify-content:space-between;align-items:center">
         <div><div style="font-size:14px;font-weight:750">${l}</div>
         <div style="font-size:11px;color:var(--text-3)">${pts.length} entries</div></div>
         <div style="text-align:right"><span class="num" style="font-size:20px;font-weight:850;letter-spacing:-.5px">${last[k]}</span>
         <span style="font-size:11px;color:var(--text-3);font-weight:700"> ${u}</span>
         ${chg!=null?`<div style="font-size:11px;font-weight:700" class="${chg>0?'up':'down'}">${chg>0?'+':''}${rnd(chg,1)} ${u}</div>`:''}</div>
       </div>
       ${pts.length>1?`<div class="chart-wrap" style="margin-top:8px">${lineChart([{pts:pts.map(p=>({v:p[k]})),color:'var(--violet)',area:true}],{h:56,l:26,dp:1})}</div>`:''}
     </div>`;}).join('')
    :'<div class="empty"><div class="ei">📏</div><h4>No measurements yet</h4><p>Record a baseline now and repeat every 4 weeks, same time of day, same conditions.</p></div>'}
   <div class="card">
     <div class="card-t" style="margin-bottom:10px">What drives the physique goal</div>
     <div class="kv"><span class="k">Shoulder width / V-taper</span><span class="v">Lateral Raise · Pike Push-Up · Band Lat Pulldown</span></div>
     <div class="kv"><span class="k">Upper back</span><span class="v">Band Row · DB Row · Face Pull</span></div>
     <div class="kv"><span class="k">Chest definition</span><span class="v">Push-Up progressions · Floor Press</span></div>
     <div class="kv"><span class="k">Arms</span><span class="v">Curls + Triceps at high reps to failure</span></div>
     <div class="kv"><span class="k">Posture</span><span class="v">Pull-Apart · Prone Y-T-W · Wall Slides</span></div>
     <div class="note acc" style="margin-top:11px">With 5 kg dumbbells, visible change comes from <b>proximity to failure, slow eccentrics and total weekly sets</b> — not from load. That is why the upper-body sessions prescribe 15–25 reps at RPE 8–9 rather than heavy triples.</div>
   </div>`;
  $('#phAdd').onclick=()=>{
    openSheet('Add measurements',`
      <div class="field"><label>Date</label><input class="inp" type="date" id="phDate" value="${todayISO()}"></div>
      <div class="grid2">
        ${F.map(([k,l,u])=>`<div class="field"><label>${l} (${u})</label>
          <input class="inp num phF" data-k="${k}" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>`).join('')}
      </div>
      <div class="field"><label>Notes</label><textarea class="inp" id="phNote" placeholder="Conditions, time of day, how you look/feel"></textarea></div>
      <div class="hint">Measure at the same time of day, ideally in the morning before eating, with the same tape tension each time.</div>
    `,`<button class="btn primary big block" id="phSave">Save</button>`);
    $('#phSave').onclick=()=>{
      const rec={id:'p'+uid(),date:$('#phDate').value,notes:$('#phNote').value.trim()};
      let any=false;
      $$('.phF').forEach(i=>{ if(i.value!==''){ rec[i.dataset.k]=parseFloat(i.value); any=true; } });
      if(!any){ toast('Enter at least one measurement','err'); return; }
      DB.physique.push(rec); save(true); closeSheet(); toast('Saved','ok'); setTimeout(()=>viewProgress($('#view')),240);
    };
  };
}

/* ------------------------------------------------------------ LINKS */
function paneLinks(c){
  const cors=correlations();
  c.innerHTML=`
   <div class="note red" style="margin-bottom:14px"><b>These are correlations, not causes.</b> A relationship here means two things moved together in your data — it does not establish that one produced the other. Confounders (a busy week, illness, travel, poor sleep and hard training arriving together) are common. Treat every line below as a hypothesis worth testing deliberately, not as a finding.</div>
   ${cors.length? cors.map(x=>{
     const a=Math.abs(x.r), cls=a<0.2?'':a<0.35?'c':a<0.5?'o':'a';
     return `<div class="card tight">
       <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
         <div style="flex:1"><div style="font-size:13.5px;font-weight:700">${esc(x.label)}</div>
           <div style="font-size:11px;color:var(--text-3);margin-top:3px">${rLabel(x.r)} ${x.r>0?'positive':'negative'} relationship · n=${x.n} days</div></div>
         <div style="text-align:right"><span class="num" style="font-size:18px;font-weight:850;color:var(--${a>=0.35?'accent':'text-2'})">${x.r>0?'+':''}${rnd(x.r,2)}</span></div>
       </div>
       <div class="bar ${cls}" style="margin-top:8px"><i style="width:${clamp(a*100,3,100)}%"></i></div>
     </div>`;}).join('')
    :'<div class="empty"><div class="ei">🔗</div><h4>Not enough data yet</h4><p>Import your WHOOP export and log 2–3 weeks of activity, then relationships appear here.</p></div>'}
   ${cors.length?`<div class="card">
     <div class="card-t" style="margin-bottom:9px">How to read these</div>
     <div class="kv"><span class="k">|r| below 0.2</span><span class="v">Negligible — ignore</span></div>
     <div class="kv"><span class="k">0.2 – 0.35</span><span class="v">Weak — possible, unproven</span></div>
     <div class="kv"><span class="k">0.35 – 0.5</span><span class="v">Moderate — worth testing</span></div>
     <div class="kv"><span class="k">Above 0.5</span><span class="v">Strong — still not causal</span></div>
     <div class="hint" style="margin-top:9px">With many relationships tested at once, some will look meaningful by chance alone. In your original 181-day export, <b>no</b> journal-behaviour relationship survived correction for multiple comparisons — including the cold-shower result, which was the strongest raw signal.</div>
   </div>`:''}`;
}


/* =========================================================================
   VIEW: WHOOP  (import · baselines · trends · sleep)
   ====================================================================== */
let HTAB='trends';
function viewWhoop(v){
  const n=DB.whoop.cycles.length;
  appbar('WHOOP', n? `${n} cycles · ${DB.whoop.cycles[0].date} → ${DB.whoop.cycles[n-1].date}` : 'No data imported yet');
  v.innerHTML=`<div class="seg acc" id="hSeg" style="margin-bottom:14px">
      <button data-t="trends">Trends</button><button data-t="sleep">Sleep</button>
      <button data-t="baselines">Baselines</button><button data-t="import">Import</button>
    </div><div id="hBody"></div>`;
  $$('#hSeg button').forEach(b=>{ b.classList.toggle('on',b.dataset.t===HTAB);
    b.onclick=()=>{ HTAB=b.dataset.t; viewWhoop(v); }; });
  ({trends:paneTrends,sleep:paneSleep,baselines:paneBaselines,import:paneImport}[HTAB])($('#hBody'));
  bindInputs(v);
}
function needImport(c){
  c.innerHTML=`<div class="empty"><div class="ei">📊</div><h4>No WHOOP data yet</h4>
    <p>Import your WHOOP CSV export to unlock trends, baselines and correlations.</p>
    <button class="btn primary" id="niGo" style="margin-top:16px">Go to import</button></div>`;
  $('#niGo').onclick=()=>{ HTAB='import'; viewWhoop($('#view')); };
}
function paneTrends(c){
  const C=DB.whoop.cycles; if(!C.length) return needImport(c);
  const N=Math.min(60,C.length), R=C.slice(-N);
  const B=DB.baselines;
  const last7=C.slice(-7), prev7=C.slice(-14,-7);
  const d=(k,dp)=>{ const a=mean(last7.map(x=>x[k])), b=mean(prev7.map(x=>x[k]));
    if(a==null||b==null)return ''; const v=a-b; return `${v>0?'▲':v<0?'▼':'–'} ${Math.abs(rnd(v,dp||0))} vs prev 7d`; };
  c.innerHTML=`
   <div class="stats">
     ${statTile('Recovery',rnd(mean(last7.map(x=>x.recovery)),0),'%','a',d('recovery'))}
     ${statTile('HRV',rnd(mean(last7.map(x=>x.hrv)),0),'ms','c',d('hrv'))}
     ${statTile('RHR',rnd(mean(last7.map(x=>x.rhr)),1),'bpm','',d('rhr',1))}
   </div>
   <div class="card" style="margin-top:12px">
     <div class="card-h"><div class="card-t accent">Recovery — last ${N} days</div></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.recovery})),color:'var(--accent)',area:true}],{h:104,min:0,max:100,baseline:B.recovery})}</div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Daily recovery</span><span><i style="background:var(--text-3)"></i>Your ${dv(B.recovery,0)}% average</span></div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">HRV vs baseline</div><span class="tag c">${dv(B.hrv,0)} MS ± ${dv(B.hrvSd,0)}</span></div>
     <div class="chart-wrap">${lineChart([
       {pts:R.map(x=>({v:x.hrv})),color:'var(--cyan)',area:true},
       {pts:R.map((x,i)=>({v:mean(R.slice(Math.max(0,i-6),i+1).map(y=>y.hrv))})),color:'var(--violet)',dots:false,w:1.6,dash:true}
     ],{h:104,baseline:B.hrv})}</div>
     <div class="legend"><span><i style="background:var(--cyan)"></i>Daily HRV</span><span><i style="background:var(--violet)"></i>7-day average</span><span><i style="background:var(--text-3)"></i>Baseline</span></div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Resting heart rate</div><span class="tag">${dv(B.rhr,1)} BPM ± ${dv(B.rhrSd,1)}</span></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.rhr})),color:'var(--orange)',area:true}],{h:92,baseline:B.rhr,dp:0})}</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Respiratory rate</div><span class="tag">${dv(B.respRate,1)} RPM ± ${dv(B.respSd,2)}</span></div>
     <div class="chart-wrap">${lineChart([{pts:R.map(x=>({v:x.resp})),color:'var(--violet)',area:true}],{h:84,dp:1,baseline:B.respRate})}</div>
     <div class="hint" style="margin-top:6px">This metric is normally very stable. A sustained jump alongside feeling unwell is worth taking seriously — as a health signal, not a training one.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Day strain</div></div>
     <div class="chart-wrap">${barChart(C.slice(-28).map(x=>({v:x.strain,color:x.strain>=14?'var(--orange)':x.strain>=10?'var(--accent)':'var(--surface-3)'})),{h:84,max:21})}</div>
     <div class="hint" style="margin-top:6px">Orange bars are strain 14+, the band that has historically cost you around 20 recovery points the next day.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Recovery band mix — last 30 days</div></div>
     ${(()=>{const l=C.slice(-30).filter(x=>x.recovery!=null);
       const g=l.filter(x=>x.recovery>=67).length,y=l.filter(x=>x.recovery>=34&&x.recovery<67).length,r=l.filter(x=>x.recovery<34).length;
       const t=l.length||1;
       return `<div style="display:flex;height:11px;border-radius:99px;overflow:hidden;margin-bottom:11px">
         <div style="width:${g/t*100}%;background:var(--green)"></div>
         <div style="width:${y/t*100}%;background:var(--yellow)"></div>
         <div style="width:${r/t*100}%;background:var(--red)"></div></div>
         <div class="kv"><span class="k" style="color:var(--green)">Green (67+)</span><span class="v">${g} days · ${Math.round(g/t*100)}%</span></div>
         <div class="kv"><span class="k" style="color:var(--yellow)">Yellow (34–66)</span><span class="v">${y} days · ${Math.round(y/t*100)}%</span></div>
         <div class="kv"><span class="k" style="color:var(--red)">Red (under 34)</span><span class="v">${r} days · ${Math.round(r/t*100)}%</span></div>`;})()}
   </div>`;
}
function paneSleep(c){
  const C=DB.whoop.cycles.filter(x=>x.sleepMin!=null); if(!C.length) return needImport(c);
  const R=C.slice(-45), B=DB.baselines;
  const shortfalls=C.map(x=>(x.sleepNeed||B.sleepNeed)-x.sleepMin);
  const under=shortfalls.filter(s=>s>0);
  const buckets=[{l:'Met need',f:s=>s<=0},{l:'0–60 min short',f:s=>s>0&&s<=60},
                 {l:'60–120 min short',f:s=>s>60&&s<=120},{l:'120+ min short',f:s=>s>120}];
  c.innerHTML=`
   <div class="stats">
     ${statTile('Avg sleep',fmtMin(mean(C.map(x=>x.sleepMin))),'','c')}
     ${statTile('Sleep need',fmtMin(B.sleepNeed),'','a')}
     ${statTile('Efficiency',rnd(mean(C.map(x=>x.sleepEff)),0),'%','g')}
   </div>
   <div class="card" style="margin-top:12px">
     <div class="card-h"><div class="card-t accent">Sleep vs need — last ${R.length} nights</div></div>
     <div class="chart-wrap">${lineChart([
       {pts:R.map(x=>({v:x.sleepMin})),color:'var(--cyan)',area:true},
       {pts:R.map(x=>({v:x.sleepNeed||B.sleepNeed})),color:'var(--accent)',dots:false,dash:true,w:1.6}],{h:104,l:34})}</div>
     <div class="legend"><span><i style="background:var(--cyan)"></i>Slept</span><span><i style="background:var(--accent)"></i>Need</span></div>
     <div class="note ${mean(under)>60?'warn':'acc'}" style="margin-top:11px">
       You were short of need on <b>${under.length} of ${C.length}</b> nights (${Math.round(under.length/C.length*100)}%), by an average of <b>${rnd(mean(under),0)} min</b> when short.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">The 60-minute cliff</div></div>
     ${buckets.map(b=>{
       const rows=C.filter(x=>b.f((x.sleepNeed||B.sleepNeed)-x.sleepMin));
       const rec=mean(rows.map(x=>x.recovery));
       return `<div style="margin-bottom:12px">
         <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
           <span style="font-weight:650;color:var(--text-2)">${b.l} <span style="color:var(--text-3);font-weight:600">· ${rows.length} nights</span></span>
           <span class="num" style="font-weight:800;color:${rec>=67?'var(--green)':rec>=55?'var(--yellow)':'var(--orange)'}">${rec!=null?rnd(rec,1)+'%':'—'}</span></div>
         <div class="bar ${rec>=67?'g':rec>=55?'y':'o'}"><i style="width:${rec?clamp(rec,0,100):0}%"></i></div></div>`;}).join('')}
     <div class="note acc">Average recovery by how far short of need you slept. In your original export the drop was sharp and specific: staying within 60 minutes cost nothing, going past it cost 11–16 points. That threshold is built into the daily engine.</div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Sleep stages — last ${Math.min(30,R.length)} nights</div></div>
     ${['deep','rem','light'].map((k,i)=>{
       const v=mean(C.slice(-30).map(x=>x[k]));
       return `<div class="kv"><span class="k">${['Deep (SWS)','REM','Light'][i]}</span><span class="v">${fmtMin(v)} avg</span></div>`;}).join('')}
     <div class="kv"><span class="k">Awake</span><span class="v">${fmtMin(mean(C.slice(-30).map(x=>x.awake)))} avg</span></div>
     <div class="kv"><span class="k">Sleep consistency</span><span class="v">${rnd(mean(C.slice(-30).map(x=>x.sleepCons)),0)}%</span></div>
   </div>
   <div class="card">
     <div class="card-h"><div class="card-t">Sleep &amp; recovery</div></div>
     <div class="chart-wrap">${lineChart([
       {pts:R.map(x=>({v:x.recovery})),color:'var(--accent)'},
       {pts:R.map(x=>({v:x.sleepMin!=null?clamp(x.sleepMin/600*100,0,100):null})),color:'var(--cyan)'}],{h:96,min:0,max:100})}</div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Recovery %</span><span><i style="background:var(--cyan)"></i>Sleep (scaled)</span></div>
   </div>`;
}
function paneBaselines(c){
  const B=DB.baselines;
  c.innerHTML=`
   <div class="note ${B.computed?'acc':''}" style="margin-bottom:14px">${esc(B.source)}</div>
   <div class="card">
     <div class="card-h"><div class="card-t accent">Your personal baselines</div>
       <button class="btn xs ghost" id="bRecalc">Recalculate</button></div>
     ${[['HRV','hrv','ms',0],['HRV variability (SD)','hrvSd','ms',1],
        ['Resting HR','rhr','bpm',1],['RHR variability (SD)','rhrSd','bpm',1],
        ['Typical recovery','recovery','%',1],['Recovery variability (SD)','recoverySd','%',1],
        ['Sleep need','sleepNeed','min',0],['Typical sleep','sleepMean','min',0],
        ['Respiratory rate','respRate','rpm',2],['Typical day strain','strainMean','',1]]
       .map(([l,k,u,dp])=>`<div class="kv"><span class="k">${l}</span><span class="v num">${B[k]!=null?rnd(B[k],dp):'—'} ${u}</span></div>`).join('')}
   </div>
   <div class="card">
     <div class="card-t" style="margin-bottom:10px">How the engine uses these</div>
     <div class="kv"><span class="k">HRV alert threshold</span><span class="v">below ${rnd(B.hrv-1.5*B.hrvSd,0)} ms</span></div>
     <div class="kv"><span class="k">RHR alert threshold</span><span class="v">above ${rnd(B.rhr+1.5*B.rhrSd,0)} bpm</span></div>
     <div class="kv"><span class="k">Sleep floor (no penalty)</span><span class="v">${fmtMin(B.sleepNeed-60)}</span></div>
     <div class="kv"><span class="k">Hard-strain threshold</span><span class="v">${DB.settings.hardStrain}+</span></div>
     <div class="hint" style="margin-top:9px">Thresholds are expressed in standard deviations from <i>your</i> baseline rather than population norms, so an 83 ms HRV is not compared to anyone else's.</div>
   </div>
   <div class="card">
     <div class="card-t" style="margin-bottom:10px">Data inventory</div>
     <div class="kv"><span class="k">WHOOP cycles</span><span class="v">${DB.whoop.cycles.length}</span></div>
     <div class="kv"><span class="k">WHOOP workouts</span><span class="v">${DB.whoop.workouts.length}</span></div>
     <div class="kv"><span class="k">Journal entries</span><span class="v">${DB.whoop.journal.length}</span></div>
     <div class="kv"><span class="k">Your check-ins</span><span class="v">${Object.keys(DB.checkins).length}</span></div>
     <div class="kv"><span class="k">Your completed sessions</span><span class="v">${DB.sessions.filter(s=>s.done).length}</span></div>
     <div class="kv"><span class="k">Your logged activities</span><span class="v">${DB.activities.length}</span></div>
   </div>
   ${DB.whoop.journal.length?journalCard():''}`;
  $('#bRecalc').onclick=()=>{ recomputeBaselines(); save(true); toast('Baselines recalculated','ok'); viewWhoop($('#view')); };
}
function journalCard(){
  const J=DB.whoop.journal, qs={};
  J.forEach(j=>{ qs[j.q]=qs[j.q]||{n:0,y:0}; qs[j.q].n++; if(j.yes)qs[j.q].y++; });
  const rows=Object.entries(qs).map(([q,v])=>({q,n:v.n,pct:v.y/v.n*100}))
    .filter(r=>r.n>=10).sort((a,b)=>Math.abs(50-a.pct)-Math.abs(50-b.pct));
  const useful=rows.filter(r=>r.pct>3&&r.pct<97);
  return `<div class="card">
    <div class="card-h"><div class="card-t">Journal behaviours</div><span class="tag">${rows.length} QUESTIONS</span></div>
    <div class="hint" style="margin-bottom:11px">Only questions that actually <b>vary</b> can tell you anything. ${rows.length-useful.length} of your ${rows.length} questions are answered the same way over 97% of the time and carry no information.</div>
    ${useful.slice(0,14).map(r=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="color:var(--text-2);font-weight:600;flex:1;padding-right:8px">${esc(r.q)}</span>
        <span class="num" style="font-weight:750">${rnd(r.pct,0)}%</span></div>
      <div class="bar c"><i style="width:${r.pct}%"></i></div></div>`).join('')}
    <div class="note warn" style="margin-top:11px">Behaviour-to-recovery relationships are shown under <b>Progress → Links</b>, and every one of them is a correlation only.</div>
  </div>`;
}
